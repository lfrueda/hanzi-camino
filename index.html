<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>汉字 · Camino</title>
<meta name="theme-color" content="#e8e5dc">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preload" href="kai.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face{font-family:"Kai";src:url(kai.woff2) format("woff2");font-display:block}   /* block: mientras carga NO se pinta con otra letra (antes swap: salía un instante con otra tipografía) */
  :root{
    --paper:#e8e5dc; --sheet:#f3f1ea; --ink:#1d1b18; --ink2:#4a463e; --muted:#7b7568; --line:#cfc9bb;
    --seal:#b5312b; --jade:#2f6b4c; --kai:"Kai",KaiTi,STKaiti,"Kaiti SC",serif;
    --cjk:var(--kai);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  html{touch-action:manipulation}   /* se puede hacer zoom con dos dedos, pero tocar rápido dos veces un botón no acerca la pantalla */
  button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
  .wrap{max-width:560px;margin:0 auto;padding:0 18px}
  .cjk{font-family:var(--kai)}
  /* ---------- camino ---------- */
  #camino header{position:sticky;top:0;background:#e8e5dcf2;backdrop-filter:blur(4px);z-index:2;
    display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1.5px solid var(--ink)}
  #camino header h1{margin:0;font-family:var(--kai);font-size:30px;font-weight:400;letter-spacing:4px}
  .chips{display:flex;gap:16px;font-weight:700;font-size:15px;align-items:center}
  .ajuste{display:inline-flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:700;line-height:1;color:var(--ink2);min-width:40px}
  .ajuste i{width:30px;height:30px;display:flex;align-items:center;justify-content:center;
    border-radius:5px;background:var(--seal);color:#f6e9e4;transform:rotate(-6deg);box-shadow:inset 0 0 0 2px var(--seal),inset 0 0 0 3.5px #f6e9e4;
    transition:transform .15s,background .15s}
  .ajuste i svg{width:18px;height:18px}
  .ajuste:active i{transform:rotate(-6deg) scale(.9)}
  .ajuste.off{color:var(--muted)}
  .ajuste.off i{background:transparent;color:var(--muted);box-shadow:none;border:1.5px dashed var(--line);transform:none}
  /* etiqueta de qué es lo que ves: radical, hanzi, palabra, frase, pregunta, diálogo */
  .tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--seal);border:1.5px solid var(--seal);padding:2px 8px;margin-bottom:6px}
  .tag + br + .intro{display:block;margin-top:14px}
  /* ejemplos de las notas: lista con un sello rojo inclinado en vez del punto */
  .ejemplos{list-style:none;display:table;margin:8px auto 0;padding:0;text-align:left;color:var(--ink2);font-size:14px;line-height:1.45}
  .ejemplos li{position:relative;padding-left:24px;margin:6px 0}
  .ejemplos li::before{content:"";position:absolute;left:3px;top:.3em;width:12px;height:12px;border-radius:2px;background:var(--seal);
    transform:rotate(-8deg);box-shadow:inset 0 0 0 1.5px var(--seal),inset 0 0 0 2.5px #f6e9e4}
  .nw{white-space:nowrap}
  /* partes del hanzi: la animación (trazos encima del carácter) y su lista */
  .trazos-partes{position:absolute;left:50%;top:9%;height:82%;width:auto;aspect-ratio:1/1;transform:translateX(-50%);overflow:visible;pointer-events:none;fill:var(--ink)}
  .trazos-partes .parte{transition:transform .7s cubic-bezier(.25,.9,.3,1),fill .4s,opacity .35s}   /* sin rebote: con cubic-bezier(.3,1.3,.5,1) la parte se pasaba del marco al separarse */ .trazos-partes .parte.tenue{opacity:.2}
  .palabra.cargando .mizi>span{visibility:hidden}
  /* Marco, dibujo y partes se mueven A LA VEZ, con la misma duración y la misma curva (2026-11-13): antes el marco
     saltaba sin transición y el dibujo cambiaba de tamaño de golpe al juntarse. Si cambias una, cambia las tres. */
  .palabra .mizi{transition:width .7s cubic-bezier(.25,.9,.3,1),height .7s cubic-bezier(.25,.9,.3,1),margin .7s cubic-bezier(.25,.9,.3,1)} .palabra{transition:column-gap .7s cubic-bezier(.25,.9,.3,1)}
  .trazos-partes.mov{transition:width .7s cubic-bezier(.25,.9,.3,1),height .7s cubic-bezier(.25,.9,.3,1),transform .7s cubic-bezier(.25,.9,.3,1)}
  .palabra.animando{align-items:center} .palabra.abierta{column-gap:8px} .palabra.abierta .mizi+.mizi{margin-left:0}
  .palabra .sello{transition:opacity .3s} .palabra.animando .sello{opacity:0}
  .letrero-parte{height:0;overflow:hidden;opacity:0;margin:-6px 0 0;transition:height .35s,opacity .3s;font-size:16px;line-height:1.3;color:var(--ink2)}
  .letrero-parte.on{height:70px;opacity:1}
  .letrero-parte .h{font-family:var(--kai);font-size:28px;line-height:1;vertical-align:-4px;margin-right:6px}
  .letrero-parte .suma .h{margin:0 2px}
  .letrero-parte .r{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-top:2px}
  .letrero-parte .puntos{display:flex;gap:5px;justify-content:center;margin-top:5px} .letrero-parte .puntos i{width:7px;height:7px;border-radius:50%;background:#cfc9bb}
  /* 印谱 álbum de sellos */
  .chip-indice{display:inline-flex;align-items:center;gap:5px;font:inherit;font-weight:700;color:var(--seal);background:none;border:0;padding:0;cursor:pointer}
  .chip-indice .mini{display:inline-block;width:22px;height:22px} .chip-indice .mini svg{width:100%;height:100%;display:block}
  .estampa{width:140px;height:140px;margin:4px auto 2px} .estampa svg{width:100%;height:100%;animation:estampa .55s cubic-bezier(.2,1.6,.4,1) both .35s}
  @keyframes estampa{from{transform:scale(2.2) rotate(-14deg);opacity:0}to{transform:none;opacity:1}}
  .nuevo-sello{font-size:15px;color:var(--ink2);margin:6px 0 4px} .nuevo-sello b{color:var(--seal);font-weight:400} .nuevo-sello .cjk{font-size:19px}
  .logro-nuevo{display:flex;align-items:center;gap:10px;max-width:330px;margin:10px auto 0;padding:8px 12px;border:1.5px dashed var(--oro,#b0731f);background:#f6efe1;font-size:14px;color:var(--ink2);text-align:left}
  .logro-nuevo svg{width:46px;height:46px;flex:none} .logro-nuevo b{color:#b0731f}
  .album-hoja{position:fixed;inset:0;z-index:60;overflow-y:auto;background:var(--paper);padding:12px 16px 40px}
  body.con-album{overflow:hidden}
  .album-hoja h2{font-family:var(--kai);font-weight:400;font-size:34px;margin:0;text-align:center}
  .ap-cabeza{display:flex;justify-content:flex-end} .ap-cerrar{font:inherit;font-size:22px;background:none;border:0;color:var(--ink2);padding:4px 8px;cursor:pointer}
  .ap-sub{text-align:center;color:var(--muted);font-size:13px;margin:2px 0 10px}
  .ap-seccion{font-size:13px;font-weight:700;color:var(--ink2);margin:16px 2px 8px;display:flex;justify-content:space-between} .ap-seccion span{font-weight:400;color:var(--muted)}
  .ap-rejilla{display:grid;grid-template-columns:repeat(4,1fr);gap:8px} .ap-rejilla.logros{grid-template-columns:repeat(3,1fr)}
  /* modo dev (panel escondido para revisar pantallas) */
  #dev h2{font-family:inherit;font-weight:800;font-size:22px;letter-spacing:.04em}
  .dev-info{font-size:13px;color:var(--ink2);margin:0 2px 8px;line-height:1.5}
  .dev-fila{display:flex;flex-wrap:wrap;gap:8px}
  .dev-b{font-size:14px;padding:9px 12px;background:var(--sheet);color:var(--ink);border:1.5px solid var(--line);border-radius:8px;text-align:left}
  .dev-b b{font-family:var(--kai);font-weight:400;font-size:19px;margin-right:6px}
  .dev-b:disabled{opacity:.6}
  .dev-campo{display:block;width:100%;font:inherit;font-size:17px;padding:11px 12px;margin-bottom:8px;border:1.5px solid var(--line);border-radius:8px;background:var(--sheet);color:var(--ink)}
  .dev-rejilla{display:grid;grid-template-columns:repeat(3,1fr);gap:6px} .dev-rejilla .dev-b{text-align:center;padding:9px 4px;font-size:13px}
  .ap-hueco{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--sheet);border:1px solid var(--line);position:relative;padding:4px 2px;font:inherit;cursor:pointer}
  .ap-hueco svg{width:66%;height:auto;flex:none} .ap-hueco .pie{font-size:9px;color:var(--muted);text-align:center;margin-top:2px;line-height:1}
  .ap-hueco.vacio{background:transparent;border:1.5px dashed var(--line);cursor:default;padding:4px 2px} .ap-hueco .pie-vacio{font-size:10px;color:#b3ad9f}
  .ap-hueco.vacio i{font-style:normal;color:#cfc9bb}
  .ap-rejilla.logros .ap-hueco{aspect-ratio:auto;gap:4px;padding:8px 4px} .ap-rejilla.logros .ap-hueco svg{width:60px}
  .ap-rejilla.logros .ap-hueco b{font-size:11px;color:var(--ink2);line-height:1.2;text-align:center} .ap-rejilla.logros .vacio b{color:var(--muted);font-weight:400} .ap-rejilla.logros .vacio i{font-family:inherit;font-size:26px}
  .ap-detalle{position:fixed;inset:0;z-index:61;background:#1d1b1866;display:flex;align-items:center;justify-content:center;padding:20px}
  .ap-detalle[hidden]{display:none}
  .ap-detalle .caja{background:var(--sheet);border:1.5px solid var(--ink);padding:18px 20px;text-align:center;min-width:240px;max-width:320px}
  .ap-detalle svg{width:130px;height:130px} .ap-detalle .py{color:var(--seal);font-size:22px;margin-top:6px} .ap-detalle .es{font-size:17px;margin-top:2px}
  .ap-detalle .de{font-size:13px;color:var(--muted);margin-top:8px} .ap-detalle .toca{font-size:12px;color:var(--muted);margin:10px 0 0}
  .botones-intro{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}   /* un grupo de hanzi no se parte entre renglones */
  .ico{display:inline-block;width:1.1em;height:1.1em;vertical-align:-.18em}
  .oir{gap:7px}
  .bocina{color:var(--ink2);padding:6px}
  /* diálogo propio (en vez del confirm del navegador) */
  #dlg{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:#1d1b1866}
  #dlg.on{display:flex;animation:dlgFondo .18s ease-out}
  #dlg .caja{width:100%;max-width:560px;background:var(--paper);border-top:2px solid var(--ink);padding:26px 20px calc(18px + env(safe-area-inset-bottom));
    position:relative;animation:dlgSube .22s ease-out}
  #dlg .caja::before{content:"";position:absolute;left:12px;top:0;bottom:0;width:1.5px;background:var(--seal);opacity:.5}
  #dlg .sellod{position:absolute;right:20px;top:-24px;width:52px;height:52px;border-radius:6px;background:var(--seal);color:#f6e9e4;font-family:var(--kai);
    font-size:30px;display:flex;align-items:center;justify-content:center;transform:rotate(-8deg);box-shadow:inset 0 0 0 3px var(--seal),inset 0 0 0 5px #f6e9e4}
  #dlg h3{margin:0 70px 6px 10px;font-size:20px} #dlg p{margin:0 0 18px 10px;color:var(--ink2);line-height:1.45}
  #dlg .bots{display:flex;gap:10px} #dlg .bots .btn{flex:1}
  #dlg .btn.sec{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
  #dlg .btn.peligro{background:var(--seal)}
  @keyframes dlgSube{from{transform:translateY(100%)}to{transform:none}}
  @keyframes dlgFondo{from{background:#1d1b1800}to{background:#1d1b1866}}
  @media (prefers-reduced-motion:reduce){#dlg.on,#dlg .caja{animation:none}}
  .chips .ajustes{display:flex;gap:6px}
  .unidad{margin:24px 0 8px;background:var(--sheet);padding:16px 16px 14px 22px;border:1.5px solid var(--ink);position:relative}
  .unidad::before{content:"";position:absolute;left:10px;top:0;bottom:0;width:1.5px;background:var(--seal);opacity:.55}
  .unidad.locked{opacity:.5}
  .unidad .num{font-family:var(--kai);font-size:22px;color:var(--seal)}
  .unidad h2{margin:0;font-size:17px}
  .unidad p{margin:3px 0 0;color:var(--muted);font-size:14px}
  .unidad .rads{font-family:var(--kai);font-size:24px;margin-top:6px;letter-spacing:8px}
  .lecciones{display:flex;justify-content:space-around;padding:16px 0 2px}
  .nodo{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
  .cuadro{width:66px;height:66px;display:flex;align-items:center;justify-content:center;font-family:var(--kai);font-size:34px;
    border:1.5px dashed var(--line);color:var(--line);position:relative;
    background:linear-gradient(to right,transparent 49.5%,#cfc9bb66 49.5%,#cfc9bb66 50.5%,transparent 50.5%),
               linear-gradient(to bottom,transparent 49.5%,#cfc9bb66 49.5%,#cfc9bb66 50.5%,transparent 50.5%)}
  .nodo.now .cuadro{background:var(--ink);color:var(--sheet);border:1.5px solid var(--ink)}
  .nodo.now{color:var(--ink);font-weight:700}
  .nodo.done .cuadro{background:var(--seal);color:#f6e9e4;border:none;border-radius:6px;transform:rotate(-5deg);
    box-shadow:inset 0 0 0 3px var(--seal),inset 0 0 0 5px #f6e9e4}
  .nodo:disabled{cursor:default}
  .pie{color:var(--muted);font-size:13px;text-align:center;margin:30px 0 40px}
  .pie button{color:var(--ink2);text-decoration:underline;margin:0 6px}
  .pie .sync-estado{margin:10px 0 0;font-size:12px} .pie .sync-estado.mal{color:var(--seal)}
  #dlg input.campo{display:block;width:calc(100% - 10px);margin:-6px 0 18px 10px;font:inherit;font-size:20px;padding:12px;
    border:1.5px solid var(--ink);border-radius:6px;background:var(--sheet);color:var(--ink)}
  #dlg input.campo:focus{outline:none;box-shadow:0 0 0 3px #b5312b55} #dlg input.campo.codigo{text-align:center;letter-spacing:8px;font-size:26px}
  #dlg p.aviso{color:var(--seal);margin-top:-10px}
  /* ---------- lección ---------- */
  #leccion{display:none;min-height:100vh;flex-direction:column}
  .top{display:flex;align-items:center;gap:14px;padding:18px}
  .top .x{font-size:22px;color:var(--ink2);width:28px}
  .barra{flex:1;height:8px;background:var(--line)}
  .barra i{display:block;height:100%;width:0;background:var(--ink);transition:width .35s}
  .ej{flex:1;padding:4px 18px 170px}
  .ej h3{margin:4px 0 14px;font-size:19px;font-weight:600}
  .mizi{width:200px;height:200px;margin:8px auto 18px;position:relative;border:2px solid var(--seal)}
  .mizi::before{content:"";position:absolute;inset:0;background:
      linear-gradient(to right,transparent 49.6%,#b5312b55 49.6%,#b5312b55 50.4%,transparent 50.4%),
      linear-gradient(to bottom,transparent 49.6%,#b5312b55 49.6%,#b5312b55 50.4%,transparent 50.4%),
      linear-gradient(to top right,transparent 49.7%,#b5312b30 49.7%,#b5312b30 50.3%,transparent 50.3%),
      linear-gradient(to bottom right,transparent 49.7%,#b5312b30 49.7%,#b5312b30 50.3%,transparent 50.3%)}
  .mizi>span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--kai);font-size:160px;line-height:1}
  .sello{position:absolute;right:-22px;bottom:-18px;width:60px;height:60px;border-radius:6px;background:var(--seal);color:#f6e9e4;
    font-family:var(--kai);font-style:normal;font-size:34px;display:flex;align-items:center;justify-content:center;transform:rotate(-8deg);
    box-shadow:inset 0 0 0 3px var(--seal),inset 0 0 0 5px #f6e9e4;animation:sellar .22s ease-out}
  .sello.mal{background:var(--ink2);box-shadow:inset 0 0 0 3px var(--ink2),inset 0 0 0 5px #e8e5dc}
  .sello.nuevo{right:auto;left:-22px;top:-18px;bottom:auto;width:46px;height:46px;font-size:26px;animation:none}
  @keyframes sellar{from{transform:rotate(-8deg) scale(1.6);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}
  @media (prefers-reduced-motion:reduce){.sello{animation:none}}
  .sub{color:var(--muted);text-align:center;margin:-6px 0 0}
  .opciones{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}   /* minmax(0,…): la columna no crece con el texto (antes se salía de la pantalla) */
  .opciones.una{grid-template-columns:minmax(0,1fr)} .opciones.una .op{overflow-wrap:anywhere}   /* una opción no cabe en media pantalla: van una debajo de otra (lo decide activaOpciones midiendo) */
  .op{background:var(--sheet);border:1.5px solid var(--ink);padding:16px 8px;font-size:16px;min-height:60px}
  .op.cjk{font-family:var(--kai);font-size:42px;padding:6px;
    background:linear-gradient(to right,transparent 49.6%,#b5312b26 49.6%,#b5312b26 50.4%,transparent 50.4%),
               linear-gradient(to bottom,transparent 49.6%,#b5312b26 49.6%,#b5312b26 50.4%,transparent 50.4%),var(--sheet)}
  .op.sel{background:var(--ink);color:var(--sheet)}
  .op.ok{background:var(--jade);color:#eef5ef;border-color:var(--jade)}
  .op.bad{background:transparent;color:var(--muted);border-style:dashed;text-decoration:line-through}
  .op:focus-visible,.btn:focus-visible,.cuadro:focus-visible{outline:3px solid var(--seal);outline-offset:2px}
  .tonos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .tonos .op{font-size:22px}
  input.py{width:100%;font:inherit;font-size:24px;text-align:center;padding:14px;border:1.5px solid var(--ink);
    background:var(--sheet);color:var(--ink);outline:none;border-radius:0}
  input.py:focus{box-shadow:0 0 0 3px #b5312b55}
  .ayuda{color:var(--muted);font-size:13px;text-align:center;margin-top:8px}
  .linea{min-height:62px;border-bottom:1.5px solid var(--ink);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;margin-bottom:18px}
  .fichas{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .ficha{background:var(--sheet);border:1.5px solid var(--ink);box-shadow:2px 2px 0 var(--ink);padding:6px 12px;font-family:var(--kai);font-size:28px}
  .ficha.hueco{visibility:hidden}
  .intro{text-align:center}
  .intro .py{font-size:26px;color:var(--seal);margin-top:4px} .intro .es{font-size:20px;margin:2px 0 12px}
  .partes{display:flex;justify-content:center;gap:8px;font-family:var(--kai);font-size:30px;margin:6px 0}
  .partes span{border:1.5px solid var(--line);padding:2px 12px;background:var(--sheet)}
  .partes span.r{border-color:var(--seal);color:var(--seal)}
  .nota{color:var(--ink2);font-size:14px;margin:8px 0 0;line-height:1.45}
  .abajo{position:fixed;left:0;right:0;bottom:0;padding:16px 18px;border-top:1.5px solid var(--ink);background:var(--paper)}
  .abajo{transition:background .2s}
  .abajo.ok{background:#dfe8de;border-top-color:var(--jade)} .abajo.bad{background:#dcd6ca}
  .abajo.ok,.abajo.bad{animation:panelSube .34s cubic-bezier(.2,.9,.25,1.15)}
  .abajo.ok .fb,.abajo.bad .fb{animation:fbEntra .3s .06s ease-out both}
  .fb{display:none;align-items:center;gap:12px}
  .fb .mini{flex:none;width:40px;height:40px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-family:var(--kai);
    font-size:24px;font-weight:400;color:#f6e9e4;transform:rotate(-8deg);animation:miniSello .3s .1s ease-out both}
  .abajo.ok .fb .mini{background:var(--jade);box-shadow:inset 0 0 0 2.5px var(--jade),inset 0 0 0 4px #eef5ef}
  .abajo.bad .fb .mini{background:var(--ink2);box-shadow:inset 0 0 0 2.5px var(--ink2),inset 0 0 0 4px #e8e5dc}
  .fb .txt{flex:1;min-width:0}
  @keyframes panelSube{from{transform:translateY(64px)}to{transform:none}}
  @keyframes fbEntra{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes miniSello{from{opacity:0;transform:rotate(-8deg) scale(1.8)}to{opacity:1;transform:rotate(-8deg) scale(1)}}
  .abajo .in{max-width:560px;margin:0 auto}
  .fb{font-weight:700;font-size:18px;margin-bottom:10px;display:none}
  .fb small{display:block;font-weight:400;font-size:15px;margin-top:3px;color:var(--ink2)}
  .abajo.ok .fb{display:flex;color:var(--jade)} .abajo.bad .fb{display:flex;color:var(--ink)}
  .btn{width:100%;padding:15px;font-weight:800;font-size:15px;background:var(--ink);color:var(--sheet);letter-spacing:.14em}

  /* ============ REDISEÑO (HANDOFF §24): la lección es un mazo de cartas sobre fondo oscuro ============
     #ej es la carta de encima (clase .carta). Sus reglas van con «.carta …» y no con «#leccion …» a propósito:
     la carta que se va se copia dentro de un shadow DOM (ver fantasma()) y ahí #leccion no existe. */
  #leccion{background:#1a1918;--papel:#f6f5f1;--tinta:#16130f;--rojo:#d63a27;--tenue:rgba(22,19,15,.62);--corte:rgba(22,19,15,.5);--suave:rgba(22,19,15,.08);
    --serif:"Iowan Old Style",Cambria,"Times New Roman",serif}
  #leccion .top{box-sizing:border-box;max-width:432px;padding:14px 18px 26px;color:#e9e5db}
  #leccion .top .x,#leccion .top .ajuste{color:#e9e5db}
  #leccion .barra{height:4px;border-radius:2px;background:rgba(233,229,219,.2)} #leccion .barra i{border-radius:2px;background:#e9e5db}
  .carta{position:relative;z-index:2;box-sizing:border-box;width:calc(100% - 32px);max-width:400px;margin:0 auto 16px;padding:16px 18px 150px;border-radius:11px;
    background:var(--papel);color:var(--tinta);font-family:var(--serif);
    box-shadow:0 1px 0 rgba(255,255,255,.75) inset,0 -1px 0 rgba(0,0,0,.18) inset,var(--pila,0 0 0 transparent),0 1px 0 #d2cec4,0 2.3px 0 #bcb7ac,0 3.5px 0 #a39e92,0 5px 1px rgba(0,0,0,.5),6px 18px 26px rgba(0,0,0,.5)}
  /* el montón: las cartas que quedan abajo asoman solo por arriba (hasta tres orillas). Son sombras de la propia carta: no hay más elementos */
  .carta[data-q="1"]{--pila:0 -12px 0 -7px #e6e3dc}
  .carta[data-q="2"]{--pila:0 -12px 0 -7px #e6e3dc,0 -22px 0 -13px #d3d0c8}
  .carta[data-q="3"]{--pila:0 -12px 0 -7px #e6e3dc,0 -22px 0 -13px #d3d0c8,0 -32px 0 -19px #bfbcb4}
  /* el grano y la fibra del papel (las imágenes las pone el script en --grano y --fibra) */
  .carta::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:9;
    background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(120,120,120,0) 45%,rgba(0,0,0,.14)),var(--fibra,none),var(--grano,none);mix-blend-mode:multiply;opacity:.48}
  /* El papel ya «horneado» (horneaPapel): la misma textura, pero como una imagen normal de sombra. Sin mix-blend-mode ni filtros de SVG al pintar,
     que en el iPhone hacían que toda la lección se sintiera lenta (medido el 2026-11-16 con ?sin=textura). */
  .carta.papel-listo::after{background:var(--papel-img) 0 0/100% 100% no-repeat;mix-blend-mode:normal;opacity:1}
  .sin-textura .carta::after{display:none}      /* diagnóstico: ?sin=textura */
  .carta.golpe{animation:golpeCarta .28s ease-out}
  @keyframes golpeCarta{0%{scale:.978}100%{scale:1}}
  .carta .tag{border:0;padding:0;margin:0 0 10px;font-family:system-ui,-apple-system,sans-serif;font-size:11px;letter-spacing:.14em;color:var(--rojo)}
  .carta .ncarta{float:right;font-style:italic;font-size:13px;color:var(--tenue)}
  .carta h3{margin:6px 0 10px;text-align:center;font-style:italic;font-weight:400;font-size:18px;color:var(--tenue)}
  .carta .sub,.carta .ayuda{color:var(--tenue);font-style:italic}
  .carta .nota{color:var(--tenue)}
  .carta .mizi{border-color:transparent} .carta .mizi::before{display:none}          /* la carta no lleva la cuadrícula 米字格 */
  .carta .intro .py{font-style:italic;color:var(--rojo)} .carta .intro .es{font-size:26px;font-weight:600;line-height:1.15}
  .carta .partes span{background:none;border-color:var(--corte)} .carta .partes span.r{border-color:var(--rojo);color:var(--rojo)}
  /* las respuestas: renglones con su letra 甲 乙 丙 丁 (antes botones en cuadrícula) */
  .carta .opciones,.carta .tonos{display:grid;grid-template-columns:minmax(0,1fr);gap:0;border-top:1px solid var(--corte)}
  .carta .op{display:flex;align-items:center;gap:14px;min-height:54px;padding:6px;border:0;border-bottom:1px solid var(--corte);border-radius:0;background:none;color:var(--tinta);
    font-size:18px;line-height:1.15;text-align:left}
  .carta .op.cjk{background:none;padding:4px 6px;font-size:34px}
  .carta .op::before{flex:none;width:24px;height:24px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-family:var(--kai);font-size:19px;line-height:1;color:var(--rojo);text-decoration:none}
  .carta .op:nth-child(1)::before{content:"甲"} .carta .op:nth-child(2)::before{content:"乙"} .carta .op:nth-child(3)::before{content:"丙"} .carta .op:nth-child(4)::before{content:"丁"}
  .carta .op.sel,.carta .op.ok{background:var(--suave);color:var(--tinta);border-color:var(--corte)}
  .carta .op.sel::before,.carta .op.ok::before{background:var(--rojo);color:var(--papel)}
  .carta .op.bad{background:none;border-style:solid;color:var(--tenue);text-decoration:line-through}
  .carta .op.bad::before{background:var(--tinta);color:var(--papel)}
  .carta input.py{border:0;border-bottom:1.5px solid var(--tinta);background:none;color:var(--tinta);font-family:var(--serif)}
  .carta input.py:focus{box-shadow:0 2px 0 var(--rojo)}
  .carta .linea{border-bottom-color:var(--corte)}
  .carta .ficha{border:1px solid var(--corte);border-radius:4px;background:var(--papel);box-shadow:0 2px 0 var(--corte)}
  /* la huella del bloque de sellos: una imagen (modelos/huellas/…) que el script coloca; el filtro le da el borde irregular de la tinta */
  .huella3d{position:absolute;z-index:8;opacity:0;pointer-events:none;mix-blend-mode:multiply;filter:url(#tinta)}
  .huella3d.on{opacity:.92}
  .huella3d.horneada{filter:none}   /* la tinta ya viene dibujada en la imagen (horneaHuella) */
  /* el botón y el aviso de abajo van DENTRO de la carta (antes era una franja de lado a lado) */
  #leccion .abajo,#leccion .abajo.ok,#leccion .abajo.bad{padding:0 16px 16px;border:0;background:none;animation:none;z-index:3;pointer-events:none}
  #leccion .abajo .in{max-width:400px;padding:26px 18px 18px;border-radius:0 0 11px 11px;background:linear-gradient(rgba(246,245,241,0),var(--papel) 24px);pointer-events:auto;font-family:var(--serif)}
  #leccion .abajo .fb{color:var(--tinta)} #leccion .abajo .fb small{color:var(--tenue)}
  #leccion .abajo.ok .fb .mini{background:var(--rojo);box-shadow:inset 0 0 0 2.5px var(--rojo),inset 0 0 0 4px var(--papel)}
  #leccion .abajo.bad .fb .mini{background:var(--tinta);box-shadow:inset 0 0 0 2.5px var(--tinta),inset 0 0 0 4px var(--papel)}
  #leccion .btn,#leccion .abajo.ok .btn{height:48px;padding:0;border-radius:4px;background:var(--tinta);color:var(--papel);font-family:system-ui,-apple-system,sans-serif;font-weight:700;font-size:13px}
  #leccion .btn:disabled{background:var(--tinta);color:var(--papel);opacity:.35}
  /* mientras el sobre 3D se abre, la lección de verdad está pintada pero invisible (se necesita en su sitio para medirla y fotografiarla) */
  #leccion .top,#leccion .abajo,.carta{transition:opacity .2s}
  #leccion.abriendo .top,#leccion.abriendo .abajo,#leccion.abriendo .carta{opacity:0;transition:none}
  #leccion.abriendo .top,#leccion.abriendo .abajo .in,#leccion.abriendo .carta{pointer-events:none}   /* invisible y sin tocarse: un toque durante el sobre solo se lo salta */
  /* ===== el resumen del final (propuesta B, elegida el 2026-11-15): «las cartas sobre la mesa» =====
     Va sobre el fondo oscuro, sin carta: #ej pierde su papel (.carta.resumen) y el botón de abajo pasa a ser claro (#leccion.resumen). */
  .carta.resumen{background:none;box-shadow:none;color:#e9e5db;padding:0 4px 150px} .carta.resumen::after{display:none}
  #leccion.resumen .abajo .in{background:none} #leccion.resumen .btn{background:var(--papel);color:var(--tinta)}
  #leccion.resumen .top{visibility:hidden}
  .resB{padding:0;text-align:left;font-family:var(--serif)}
  .resB .e{animation:rbSube .4s ease-out both}
  @keyframes rbSube{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .resB .rb-tit{font-size:15px;color:rgba(233,229,219,.7)} .resB .rb-tit b{font-family:var(--kai);font-weight:400;font-size:21px;color:#e8482f;margin-right:8px}
  /* el abanico: las cartas de la lección; --n = su lugar, --m = cuántas son, --paso = grados entre una y otra */
  .resB .rb-abanico{position:relative;height:176px;margin-top:8px}
  .resB .rb-c{position:absolute;left:50%;top:18px;width:78px;height:118px;margin-left:-39px;border-radius:7px;background:var(--papel);color:var(--tinta);font-family:var(--kai);line-height:104px;text-align:center;white-space:nowrap;overflow:hidden;
    transform-origin:50% 330px;box-shadow:0 2px 0 #a39e92,0 6px 12px rgba(0,0,0,.55);animation:rbAbre .7s cubic-bezier(.2,1.5,.4,1) calc(.1s + var(--n)*.06s) both}
  @keyframes rbAbre{from{transform:rotate(0deg) translateY(40px);opacity:0}to{transform:rotate(calc((var(--n) - (var(--m) - 1)/2)*var(--paso)));opacity:1}}

ù kàn yí wèi péngyou, hái yào zuò gōngkè. Duìbuqǐ!","No puedo, hoy en la noche no puedo tomar café contigo. Hoy en la noche estoy muy ocupada: voy a ver a una amiga y además tengo que hacer la tarea. ¡Lo siento!",["明天晚上我有空儿。几点钟？","是我，您哪位？"]],["César","没关系。明天晚上怎么样？","Méi guānxi. Míngtiān wǎnshang zěnmeyàng?","No pasa nada. ¿Qué tal mañana en la noche?",["我喜欢在家里看电视。","明天星期六，我们都不上课。你们打算干什么？"]],["Bai Xiaohong","明天晚上我有空儿。几点钟？","Míngtiān wǎnshang wǒ yǒu kòngr. Jǐ diǎn zhōng?","Mañana en la noche tengo tiempo libre. ¿A qué hora?",["我想去打球，你们去不去？","那你喜欢干什么？"]],["César","八点半，行吗？","Bā diǎn bàn, xíng ma?","A las ocho y media, ¿te parece?",["是小红吗？","白天呢？"]],["Bai Xiaohong","行。在哪儿见面？","Xíng. Zài nǎr jiànmiàn?","Va. ¿Dónde nos vemos?",["今天晚上。行吗？","不行，今天晚上我不能跟你一起喝咖啡。今天晚上我很忙，我要去看一位朋友，还要做功课。对不起！"]],["César","明天晚上八点一刻我去接你。","Míngtiān wǎnshang bā diǎn yí kè wǒ qù jiē nǐ.","Mañana a las ocho y cuarto paso por ti.",["是小红吗？","我是塞萨尔。"]],["Bai Xiaohong","好吧。谢谢！","Hǎo ba. Xièxie!","Está bien. ¡Gracias!",["行。在哪儿见面？","好啊。王英，你去不去？"]],["César","再见！","Zàijiàn!","¡Adiós!"],["Bai Xiaohong","再见！","Zàijiàn!","¡Adiós!"]]}],"pal":["没关系","空儿","点","半","见面","刻","接","再见","现在","分","早上","上午","下午"]},{"libro":true,"leccion":7,"num":"第七课","t":"Lección 7A · 你什么时候回来","d":"Las vacaciones, los viajes y describir a una persona · parte 1 de 3","muestra":"放假 月","frases":[["你们什么时候放假","¿Cuándo empiezan sus vacaciones?",["你","们","什么时候","放假"],["月","或者"]],["四月下旬","la última decena de abril",["四","月","下旬"],["旅行","回来"]],["放假以后","después de las vacaciones",["放假","以后"],["有点儿","号"]],["我想去中国旅行","Quiero viajar a China",["我","想","去","中国","旅行"],["下旬","放假"]],["五月中旬","la segunda decena de mayo",["五","月","中旬"],["以前","号"]]],"pal":["放假","月","下旬","以后","旅行","中旬","或者","回来","回","号","以前","可是","有点儿"]},{"libro":true,"leccion":7,"num":"第七课","t":"Lección 7B · 你什么时候回来","d":"Las vacaciones, los viajes y describir a una persona · parte 2 de 3","muestra":"担心 别","frases":[["我有点儿担心","Estoy algo preocupado",["我","有点儿","担心"],["帮助","副"]],["别担心","No te pr heng","你一个人去吗？","Nǐ yí ge rén qù ma?","¿Vas solo?",["什么时候回来？","你们什么时候放假？"]],["Juan","不，跟我的女朋友一起去。可是，我们的汉语不太好，我有点儿担心。","Bù, gēn wǒ de nǚ péngyou yìqǐ qù. Kěshì, wǒmen de Hànyǔ bú tài hǎo, wǒ yǒudiǎnr dānxīn.","No, voy con mi novia. Pero nuestro chino no es muy bueno y estoy algo preocupado.",["什么时候去？","我找王老师。"]],["Ding Hansheng","你别担心。我在北京、上海、四川都有朋友，可以请他们帮助你。","Nǐ bié dānxīn. Wǒ zài Běijīng, Shànghǎi, Sìchuān dōu yǒu péngyou, kěyǐ qǐng tāmen bāngzhù nǐ.","No te preocupes. Tengo amigos en Beijing, Shanghái y Sichuan; puedo pedirles que te ayuden.",["是啊，北京、上海、四川、云南……","哦，你要找王欢老师，她刚出去。"]]]},{"t":"Texto 2 · En busca de la profesora Wang (pp. 66-67)","lineas":[["安东尼奥","请问，可以进来吗？","Qǐngwèn, kěyǐ jìnlái ma?","Disculpe, ¿puedo entrar?"],["la profesora","你找谁？","Nǐ zhǎo shuí?","¿A quién busca?",["我想去中国旅行。","你别担心。我在北京、上海、四川都有朋友，可以请他们帮助你。"]],["安东尼奥","我找王老师。","Wǒ zhǎo Wáng lǎoshī.","Busco a la profesora Wang.",["五月中旬或者下旬。","这儿的老师都是女的。"]],["la profesora","哪位王老师？我们这儿有两位王老师。","Nǎ wèi Wáng lǎoshī? Wǒmen zhèr yǒu liǎng wèi Wáng lǎoshī.","¿Cuál profesora Wang? Aquí tenemos dos profesoras Wang.",["你找谁？","在我们这儿，每位老师都戴眼镜。"]],["安东尼奥","我不知道她叫什么名字。她是女的。","Wǒ bù zhīdào tā jiào shénme míngzi. Tā shì nǚ de.","No sé cómo se llama. Es mujer.",["要去很多地方吧？","什么时候回来？"]],["la profesora","这儿的老师都是女的。","Zhèr de lǎoshī dōu shì nǚ de.","Aquí todas las profesoras son mujeres.",["要去很多地方吧？","我找王老师。"]],["安东尼奥","她戴一副眼镜。","Tā dài yí fù yǎnjìng.","Ella usa lentes.",["放假以后你打算干什么？","她大概什么时候回来？"]],["la profesora","在我们这儿，每位老师都戴眼镜。","Zài wǒmen zhèr, měi wèi lǎoshī dōu dài yǎnjìng.","Aquí, todas las profesoras usan lentes.",["我不知道她叫什么名字。她是女的。","要去很多地方吧？"]],["安东尼奥","她瘦瘦的，高高的，头发长长的，穿一条牛仔裤。","Tā shòushòu de, gāogāo de, tóufa chángcháng de, chuān yì tiáo niúzǎikù.","Es delgadita, altita, de pelo largo y lleva unos vaqueros.",["四月下旬。","什么时候去？"]],["la profesora","哦，你要找王欢老师，她刚出去。","Ò, nǐ yào zhǎo Wáng Huān lǎoshī, tā gāng chūqù.","Ah, busca a la profesora Wang Huan; acaba de salir.",["我打算七月一号以前回来。","五月中旬或者下旬。"]],["安东尼奥","她大概什么时候回来？","Tā dàgài shénme shíhou huílái?","¿Más o menos cuándo regresa?",["她戴一副眼镜。","什么时候去？"]],["la profesora","不知道。你过一会儿再来看看吧。","Bù zhīdào. Nǐ guò yíhuìr zài lái kànkan ba.","No sé. Pase otra vez en un rato.",["在我们这儿，每位老师都戴眼镜。","你一个人去吗？"]]]}],"pal":["穿","牛仔裤","刚","出去","出","过","一会儿","再","上","下","今年"]},{"libro":true,"leccion":8,"num":"第八课","t":"Lección 8A · 附近有没有银行","d":"Pedir direcciones, el barrio y cómo llegar · parte 1 de 3","muestra":"附近 银行","frases":[["附近有没有银行","¿Hay algún banco cerca?",["附近","有","没有","银行"],["离","远"]],["银行在哪儿","¿Dónde está el banco?",["银行","在","哪儿"],["怎么","前面"]],["行人在哪儿","¿Dónde está el peatón?",["行人","在","哪儿"],["走","离"]],["怎么走","¿Cómo se va?",["怎么","走"],["路","离"]],["往前走","Siga adelante",["往","前","走"],["路","右面"]]],"pal":["附近","银行","行人","离","远","怎么","走","往","前面","前","右面","右","拐","马路","路"]},{"libro":true,"leccion":8,"num":"第八课","t":"Lección 8B · 附近有没有银行","d":"Pedir direcciones, el barrio y cómo llegar · parte 2 de 3","muestra":"就 邮局","frases":[["邮局就在银行的旁边","La oficina de correo está justo al lado del banco",["邮局","就","在","银行","的","旁边"],["到","不客气"]],["邮局在哪儿","¿Dónde está el correo?",["邮局","在","哪儿"],["车","市中心"]],["银行的旁边","al lado del banco",["银行","的","旁边"],["客气","就"]],["您太客气了","Es usted muy amable",["您","太","客气","了"],["旁边","从"]],["市中心在哪儿","¿Dónde está el centro?",["市中心","在","哪儿"],["邮局","从"]]],"pal":["就","邮局","旁边","不客气","客气","市中心","告诉","地铁","从","到","门口","公共汽车","汽车","车","站"]},{"libro":true,"leccion":8,"num":"第八课","t":"Lección 8C · 附近有没有银行","d":"Pedir direcciones, el barrio y cómo llegar · parte 3 de 3","muestra":"然后 换","frases":[["然后换地铁","Luego cambias al metro",["然后","换","地铁"],["上面","下面"]],["在哪儿下车","¿Dónde me bajo?",["在","哪儿","下车"],["上面","外面"]],["能不能骑自行车去","¿Puedo ir en bicicleta?",["能","不","能","骑","自行车","去"],["后面","里面"]],["骑自行车","andar en bicicleta",["骑","自行车"],["换","外面"]],["在后面","atrás",["在","后面"],["近","自行车"]]],"dialogos":[{"t":"Texto 1 · Un banco y el correo (pp. 75-76)","lineas":[["Juan","请问，附近有没有银行？","Qǐngwèn, fùjìn yǒu méiyǒu yínháng?","Disculpe, ¿hay algún banco cerca?"],["el peatón","有。附近有一个中国银行。","Yǒu. Fùjìn yǒu yí ge Zhōngguó Yínháng.","Sí. Cerca hay un Banco de China.",["有。邮局就在那个银行的旁边。","地铁站离汽车站远不远？"]],["Juan","离这儿远不远？","Lí zhèr yuǎn bu yuǎn?","¿Está lejos de aquí?",["往前进一点儿，往右拐，过两条马路，就是中国银行。","谢谢您！"]],["el peatón","不太远。","Bú tài yuǎn.","No muy lejos.",["往前进一点儿，往右拐，过两条马路，就是中国银行。","不行，太远了。"]],["Juan","怎么走？","Zěnme zǒu?","¿Cómo se va?",["有人告诉我，可以坐地铁去。","离这儿远不远？"]],["el peatón","往前进一点儿，往右拐，过两条马路，就是中国银行。","Wǎng qián zǒu yìdiǎnr, wǎng yòu guǎi, guò liǎng tiáo mǎlù, jiù shì Zhōngguó Yínháng.","Siga un poco adelante, gire a la derecha y cruce dos calles: ahí está el Banco de China.",["离这儿远不远？","同学，请问从这儿到市中心怎么走？"]],["Juan","附近有没有邮局？","Fùjìn yǒu méiyǒu yóujú?","¿Hay una oficina de correo cerca?",["能不能骑自行车去？","我们问一下吧。"]],["el peatón","有。邮局就在那个银行的旁边。","Yǒu. Yóujú jiù zài nàge yínháng de pángbiān.","Sí. Está justo al lado de ese banco.",["离这儿远不远？","不太远。"]],["Juan","谢谢您！","Xièxie nín!","¡Gracias a usted!",["请问，附近有没有银行？","我们现在怎么去市中心呢？"]],["el peatón","不客气。","Bú kèqi.","De nada.",["同学，请问从这儿到市中心怎么走？","请问，附近有没有银行？"]]]},{"t":"Texto 2 · Cómo llegar al centro (pp. 76-77)","lineas":[["Juan","我们现在怎么去市中心呢？","Wǒmen xiànzài zěnme qù shì zhōngxīn ne?","¿Cómo vamos ahora al centro?"],["Zhang Yuanyuan","有人告诉我，可以坐地铁去。","Yǒu rén gàosu wǒ, kěyǐ zuò dìtiě qù.","Alguien me dijo que se puede ir en metro.",["附近有没有邮局？","不客气。"]],["Juan","你知道怎么走吗？","Nǐ zhīdào zěnme zǒu ma?","¿Sabes cómo llegar?",["不太远。","谢谢您！"]],["Zhang Yuanyuan","不知道。","Bù zhīdào.","No.",["往前进一点儿，往右拐，过两条马路，就是中国银行。","谢谢您！"]],["Juan","我们问一下吧。","Wǒmen wèn yíxià ba.","Preguntemos, ¿no?",["不远。你下车以后往右拐，过马路，就是地铁站。","谢谢您！"]],["Juan","同学，请问从这儿到市中心怎么走？","Tóngxué, qǐngwèn cóng zhèr dào shì zhōngxīn zěnme zǒu?","Disculpa, ¿cómo se va de aquí al centro?"],["el estudiante","你在学校门口坐139路公共汽车，坐五站，然后换地铁，坐两站，从地铁站出来，就是市中心。","Nǐ zài xuéxiào ménkǒu zuò yāo-sān-jiǔ lù gōnggòng qìchē, zuò wǔ zhàn, ránhòu huàn dìtiě, zuò liǎng zhàn, cóng dìtiě zhàn chūlái, jiù shì shì zhōngxīn.","Tomas el autobús 139 en la puerta de la escuela, cinco paradas, luego cambias al metro, dos estaciones, y al salir de la estación de metro ya estás en el centro.",["附近有没有邮局？","我们现在怎么去市中心呢？"]],["Zhang Yuanyuan","地铁站离汽车站远不远？","Dìtiě zhàn lí qìchē zhàn yuǎn bu yuǎn?","¿Está la estación de metro lejos de la parada de autobús?",["离这儿远不远？","有。附近有一个中国银行。"]],["el estudiante","不远。你下车以后往右拐，过马路，就是地铁站。","Bù yuǎn. Nǐ xià chē yǐhòu wǎng yòu guǎi, guò mǎlù, jiù shì dìtiě zhàn.","No. Cuando te bajes, gira a la derecha y cruza la calle: ahí está la estación de metro.",["同学，请问从这儿到市中心怎么走？","怎么走？"]],["Juan","能不能骑自行车去？","Néng bu néng qí zìxíngchē qù?","¿Podemos ir en bicicleta?",["有。邮局就在那个银行的旁边。","谢谢您！"]],["el estudiante","不行，太远了。","Bù xíng, tài yuǎn le.","No, es demasiado lejos.",["不远。你下车以后往右拐，过马路，就是地铁站。","不客气。"]]]}],"pal":["然后","换","下车","骑","自行车","后面","左面","上面","下面","里面","外面","上车","近"]},{"libro":true,"leccion":9,"num":"第九课","t":"Lección 9A · 我以前养过鸟儿","d":"Mascotas, viajes y la experiencia pasada (过) · parte 1 de 3","muestra":"老人家 狗","frases":[["我以前养过花儿","Antes cultivé flores",["我","以前","养","过","花儿"],["猫","狗"]],["养花儿","cultivar flores",["养","花儿"],["时间","猫"]],["养过鸟儿","haber criado pájaros",["养","过","鸟儿"],["自己","狗"]],["但是我不喜欢养狗","Pero no me gusta tener perro",["但是","我","不","喜欢","养","狗"],["时间","猫"]],["我也养狗了","Ahora yo también tengo perro",["我","也","养","狗","了"],["有的","老人家"]]],"pal":["老人家","狗","养","花儿","鸟儿","但是","了","听说","城市","有的","猫","动物","麻烦","时间","自己"]},{"libro":true,"leccion":9,"num":"第九课","t":"Lección 9B · 我以前养过鸟儿","d":"Mascotas, viajes y la experiencia pasada (过) · parte 2 de 3","muestra":"办 熟悉","frases":[["办点儿事儿","hacer un trámite",["办","点","儿","事儿"],["非","一些"]],["熟悉北京","conocer bien Beijing",["熟悉","北京"],["要是","不到长城非好汉"]],["这些照片","estas fotos",["这些","照片"],["登","不到长城非好汉"]],["那些书","esos libros",["那些","书"],["好汉","办"]],["哪些人","¿cuáles personas?",["哪些","人"],["要是","登"]]],"pal":["办","熟悉","些","这些","那些","哪些","一些","照片","登","不到长城非好汉","非","好汉","别的","欢迎","要是"]},{"libro":true,"leccion":9,"num":"第九课","t":"Lección 9C · 我以前养过鸟儿","d":"Mascotas, viajes y la experiencia pasada (过) · parte 3 de 3","muestra":"陪 得","frases":[["我陪你一起去","Te acompaño",["我","陪","你","一起","去"],["得","成都"]],["你得给我买机票","Tienes que comprarme el boleto de avión",["你","得","给","我","买","机票"],["颐和园","所以"]],["买机票","comprar el boleto de avión",["买","机票"],["得","拍照"]],["一张票","un boleto",["一","张","票"],["拍照","飞机"]],["别人的东西","las cosas de otros",["别人","的","东西"],["故宫","所以"]]],"dialogos":[{"t":"Texto 1 · El perrito del señor Ding (pp. 82-83)","lineas":[["Juan","老人家，这只小狗真可爱。","Lǎorenjia, zhè zhī xiǎo gǒu zhēn kě'ài.","Señor, este perrito es muy tierno."],["el anciano","是啊。我以前养过花儿，养过鸟儿，但是不喜欢养狗。来这儿以后，这儿的人都喜欢养狗，我也养狗了。","Shì a. Wǒ yǐqián yǎngguo huār, yǎngguo niǎor, dànshì bù xǐhuan yǎng gǒu. Lái zhèr yǐhòu, zhèr de rén dōu xǐhuan yǎng gǒu, wǒ yě yǎng gǒu le.","Sí. Antes cultivé flores y crié pájaros, pero no me gustaba tener perro. Desde que llegué aquí, a todos les gusta tener perro, y ahora yo también tengo.",["什么地方？","你登过长城吗？"]],["Juan","听说在中国城市里不能养狗，是吗？","Tīngshuō zài Zhōngguó chéngshì li bù néng yǎng gǒu, shì ma?","Se dice que en las ciudades de China no se puede tener perro, ¿es cierto?",["什么地方？","上海、西安、成都……我都去过。可是，有一个地方我还没去过。"]],["el anciano","以前不行，现在可以了。有的人喜欢养狗，有的人喜欢养猫，有的人喜欢养鸟儿，还有的人喜欢养鱼……你也喜欢养小动物？","Yǐqián bù xíng, xiànzài kěyǐ le. Yǒude rén xǐhuan yǎng gǒu, yǒude rén xǐhuan yǎng māo, yǒude rén xǐhuan yǎng niǎor, hái yǒude rén xǐhuan yǎng yú… Nǐ yě xǐhuan yǎng xiǎo dòngwù?","Antes no se podía; ahora sí. A algunos les gusta tener perro, a otros gato, a otros pájaros, y a otros les gusta tener peces… ¿A ti también te gustan los animalitos?",["上海、西安、成都……我都去过。可是，有一个地方我还没去过。","不是。因为我没有时间，也没有钱。我只能养我自己。"]],["Juan","我喜欢小动物，但是不养小动物。","Wǒ xǐhuan xiǎo dòngwù, dànshì bù yǎng xiǎo dòngwù.","Me gustan los animalitos, pero no tengo.",["当然。你看这些照片。这是故宫，这是颐和园……","你还去过别的城市吗？"]],["el anciano","为什么？是不是太麻烦？","Wèi shénme? Shì bu shì tài máfan?","¿Por qué? ¿Es demasiado problema?",["下星期三。","老人家，这只小狗真可爱。"]],["Juan","不是。因为我没有时间，也没有钱。我只能养我自己。","Bú shì. Yīnwèi wǒ méiyǒu shíjiān, yě méiyǒu qián. Wǒ zhǐ néng yǎng wǒ zìjǐ.","No. Porque no tengo tiempo ni dinero. Solo puedo mantenerme a mí mismo.",["你的家。","对啊。公司让我去北京办点儿事儿。"]]]},{"t":"Texto 2 · El viaje de Antonio a Beijing (pp. 83-84)","lineas":[["Bai Xiaohong","听说，你要去北京了？","Tīngshuō, nǐ yào qù Běijīng le?","Escuché que te vas a Beijing, ¿es cierto?"],["Antonio","对啊。公司让我去北京办点儿事儿。","Duì a. Gōngsī ràng wǒ qù Běijīng bàn diǎnr shìr.","Sí. La empresa me manda a Beijing a hacer un trámite.",["听说在中国城市里不能养狗，是吗？","什么地方？"]],["Bai Xiaohong","什么时候走？","Shénme shíhou zǒu?","¿Cuándo te vas?",["你还去过别的城市吗？","“不到长城非好汉”，我怎么不能登长城呢？"]],["Antonio","下星期三。","Xià xīngqīsān.","El próximo miércoles.",["为什么？是不是太麻烦？","对啊。公司让我去北京办点儿事儿。"]],["Bai Xiaohong","你对北京很熟悉了吧？","Nǐ duì Běijīng hěn shúxī le ba?","Ya conoces bien Beijing, ¿verdad?",["听说，你要去北京了？","“不到长城非好汉”，我怎么不能登长城呢？"]],["Antonio","当然。你看这些照片。这是故宫，这是颐和园……","Dāngrán. Nǐ kàn zhèxiē zhàopiàn. Zhè shì Gùgōng, zhè shì Yíhéyuán…","Claro. Mira estas fotos: este es el Palacio Imperial y este, el Palacio de Verano…",["什么时候走？","欢迎你去呀！要是你想去的话，我陪你一起去。但是，你得给我买机票。"]],["Bai Xiaohong","你登过长城吗？","Nǐ dēngguo Chángchéng ma?","¿Has subido a la Gran Muralla?",["欢迎你去呀！要是你想去的话，我陪你一起去。但是，你得给我买机票。","听说在中国城市里不能养狗，是吗？"]],["Antonio","“不到长城非好汉”，我怎么不能登长城呢？","“Bú dào Chángchéng fēi hǎohàn”, wǒ zěnme bù néng dēng Chángchéng ne?","«Quien no llega a la Gran Muralla no es un verdadero hombre»: ¿cómo no voy a subirla?",["听说在中国城市里不能养狗，是吗？","对啊。公司让我去北京办点儿事儿。"]],["Bai Xiaohong","你还去过别的城市吗？","Nǐ hái qùguo biéde chéngshì ma?","¿Has ido a otras ciudades?",["什么时候走？","是啊。我以前养过花儿，养过鸟儿，但是不喜欢养狗。来这儿以后，这儿的人都喜欢养狗，我也养狗了。"]],["Antonio","上海、西安、成都……我都去过。可是，有一个地方我还没去过。","Shànghǎi, Xī'ān, Chéngdū… wǒ dōu qùguo. Kěshì, yǒu yí ge dìfang wǒ hái méi qùguo.","Shanghái, Xi'an, Chengdu… he ido a todas. Pero hay un lugar al que todavía no he ido.",["听说，你要去北京了？","“不到长城非好汉”，我怎么不能登长城呢？"]],["Bai Xiaohong","什么地方？","Shénme dìfang?","¿Qué lugar?",["老人家，这只小狗真可爱。","为什么？是不是太麻烦？"]],["Antonio","你的家。","Nǐ de jiā.","Tu casa.",["你还去过别的城市吗？","对啊。公司让我去北京办点儿事儿。"]],["Bai Xiaohong","欢迎你去呀！要是你想去的话，我陪你一起去。但是，你得给我买机票。","Huānyíng nǐ qù ya! Yàoshi nǐ xiǎng qù dehuà, wǒ péi nǐ yìqǐ qù. Dànshì, nǐ děi gěi wǒ mǎi jīpiào.","¡Claro que puedes venir! Si quieres ir, te acompaño. Pero tienes que comprarme el boleto de avión.",["对啊。公司让我去北京办点儿事儿。","听说在中国城市里不能养狗，是吗？"]]]}],"pal":["陪","得","机票","飞机","票","所以","别人","拍照","故宫","颐和园","长城","西安","成都"]},{"libro":true,"leccion":10,"num":"第十课","t":"Lección 10A · 她去医院了","d":"La salud, el cuerpo y las acciones en curso · parte 1 de 3","muestra":"大家 没","frases":[["大家都很忙","Todos están muy ocupados",["大家","都","很","忙"],["宿舍","可能"]],["我没有时间","No tengo tiempo",["我","没有","时间"],["正在","早饭"]],["你住哪儿","¿Dónde vives?",["你","住","哪儿"],["没","宿舍"]],["我住在宿舍","Vivo en el dormitorio",["我","住","在","宿舍"],["已经","可能"]],["在餐厅","en el comedor",["在","餐厅"],["住","睡觉"]]],"pal":["大家","没","住","宿舍","天","餐厅","早饭","可能","正在","睡觉","肯定","已经","起床"]},{"libro":true,"leccion":10,"num":"第十课","t":"Lección 10B · 她去医院了","d":"La salud, el cuerpo y las acciones en curso · parte 2 de 3","muestra":"起 床","frases":[["在床上","en la cama",["在","床","上"],["病","面包"]],["你错了","Te equivocas",["你","错","了"],["片","舒服"]],["她去医院了","Ella ha ido al hospital",["她","去","医院","了"],["舒服","杯"]],["他病了","Está enfermo",["他","病","了"],["错","医院"]],["我不太舒服","No me siento bien",["我","不","太","舒服"],["面包","起"]]],"pal":["起","床","错","医院","病","舒服","医生","肚子","疼","干净","片","面包","杯"]},{"libro":true,"leccion":10,"num":"第十课","t":"Lección 10C · 她去医院了","d":"La salud, el cuerpo y las acciones en curso · parte 3 de 3","muestra":"牛奶 不过","frases":[["喝了一杯牛奶","bebí un vaso de leche",["喝","了","一","杯","牛奶"],["着急","新鲜"]],["昨天我很忙","Ayer estuve muy ocupado",["昨天","我","很","忙"],["生鱼片","鱼片"]],["今天我请客","Hoy invito yo",["今天","我","请客"],["完","牛奶"]],["我喜欢吃生鱼片","Me gusta el sashimi",["我","喜欢","吃","生鱼片"],["说完","厕所"]],["很新鲜","Está muy fresco",["很","新鲜"],["生鱼片","着急"]]],"dialogos":[{"t":"Texto 1 · ¿Dónde está Wang Ying? (p. 90)","lineas":[["el profesor","大家都来了吗？","Dàjiā dōu lái le ma?","¿Ya llegaron todos?"],["César","王英还没来，别的同学都来了。","Wáng Yīng hái méi lái, biéde tóngxué dōu lái le.","Wang Ying todavía no ha llegado; el resto ya está aquí.",["可能生鱼片不太新鲜。你得吃药，还得……","今天早上吃了什么？"]],["el profesor","王英怎么啦？","Wáng Yīng zěnme la?","¿Qué le pasa a Wang Ying?",["对不起……","今天早上吃了什么？"]],["César","不知道。","Bù zhīdào.","No sé.",["她有点儿不舒服。","我想，现在她可能正在吃早饭。"]],["Rich","她住学生宿舍，每天在学校餐厅吃早饭。","Tā zhù xuésheng sùshè, měi tiān zài xuéxiào cāntīng chī zǎofàn.","Vive en el dormitorio de estudiantes y desayuna todos los días en el comedor de la escuela.",["大概还在睡觉呢。","医生，我肚子疼。"]],["Tanaka","我想，现在她可能正在吃早饭。","Wǒ xiǎng, xiànzài tā kěnéng zhèngzài chī zǎofàn.","Creo que ahora quizá está desayunando.",["大家都来了吗？","你们都错了。王英去医院了。"]],["Kim Yong-nam","大概还在睡觉呢。","Dàgài hái zài shuìjiào ne.","Quizá todavía está durmiendo.",["别着急，我还没说完呢。你得吃药，还得……","王英还没来，别的同学都来了。"]],["Rich","不可能，她肯定已经起床了。","Bù kěnéng, tā kěndìng yǐjīng qǐchuáng le.","Imposible: seguro que ya se levantó.",["对不起……","你是不是吃了不干净的东西？"]],["Zhang Yuanyuan","你们都错了。王英去医院了。","Nǐmen dōu cuò le. Wáng Yīng qù yīyuàn le.","Todos se equivocan. Wang Ying ha ido al hospital.",["她住学生宿舍，每天在学校餐厅吃早饭。","你是不是吃了不干净的东西？"]],["el profesor","怎么，她病了吗？","Zěnme, tā bìng le ma?","¿Cómo? ¿Está enferma?",["不可能，她肯定已经起床了。","你是不是吃了不干净的东西？"]],["Zhang Yuanyuan","她有点儿不舒服。","Tā yǒudiǎnr bù shūfu.","No se siente muy bien.",["吃了几片面包，喝了一杯牛奶。……不过，昨天晚上朋友请客，我们去了学校附近的一个饭店，我吃了很多生鱼片。","不可能，她肯定已经起床了。"]]]},{"t":"Texto 2 · En el hospital (pp. 91-92)","lineas":[["Wang Ying","医生，我肚子疼。","Yīshēng, wǒ dùzi téng.","Doctor, me duele el estómago."],["el médico","你是不是吃了不干净的东西？","Nǐ shì bu shì chī le bù gānjìng de dōngxi?","¿Ha comido algo en mal estado?",["王英怎么啦？","对不起，厕所在哪儿？"]],["Wang Ying","没有啊。","Méiyǒu a.","Que no.",["王英怎么啦？","你们都错了。王英去医院了。"]],["el médico","今天早上吃了什么？","Jīntiān zǎoshang chī le shénme?","¿Qué comió esta mañana?",["别着急，我还没说完呢。你得吃药，还得……","大概还在睡觉呢。"]],["Wang Ying","吃了几片面包，喝了一杯牛奶。……不过，昨天晚上朋友请客，我们去了学校附近的一个饭店，我吃了很多生鱼片。","Chī le jǐ piàn miànbāo, hē le yì bēi niúnǎi. …Búguò, zuótiān wǎnshang péngyou qǐngkè, wǒmen qù le xuéxiào fùjìn de yí ge fàndiàn, wǒ chī le hěn duō shēng yúpiàn.","Comí unas rebanadas de pan y bebí un vaso de leche. …Pero ayer por la noche un amigo invitó: fuimos a un restaurante cerca de la escuela y comí mucho sashimi.",["别着急，我还没说完呢。你得吃药，还得……","王英还没来，别的同学都来了。"]],["el médico","可能生鱼片不太新鲜。你得吃药，还得……","Kěnéng shēng yúpiàn bú tài xīnxiān. Nǐ děi chī yào, hái děi…","Puede que el pescado no estuviera muy fresco. Tiene que tomar medicina y además…",["怎么，她病了吗？","没有啊。"]],["Wang Ying","对不起……","Duìbuqǐ…","Perdón…",["没有啊。","不知道。"]],["el médico","别着急，我还没说完呢。你得吃药，还得……","Bié zháojí, wǒ hái méi shuōwán ne. Nǐ děi chī yào, hái děi…","No se preocupe, que no he terminado de hablar. Tiene que tomar medicina y además…",["医生，我肚子疼。","怎么，她病了吗？"]],["Wang Ying","对不起，厕所在哪儿？","Duìbuqǐ, cèsuǒ zài nǎr?","Perdón, ¿dónde está el baño?",["大家都来了吗？","大概还在睡觉呢。"]]]}],"pal":["牛奶","不过","昨天","请客","生鱼片","生","鱼片","新鲜","药","着急","说完","完","厕所"]}];
const LIBRO_P = {"您":["nín","nin2","usted (honorífico)","Pron.","Es 你 (nǐ = tú) + 心 (xīn = corazón): «tú en el corazón». Es la forma de respeto, para desconocidos o mayores."],"好":["hǎo","hao3","bien, excelente","Adj.","Saludo básico:\n- 你好 (nǐ hǎo = hola)\nCon respeto:\n- 您好 (nín hǎo = hola, a usted)"],"贵姓":["guìxìng","gui4 xing4","¿cuál es su apellido?","","Forma educada de preguntar el apellido (literal: «apellido honorable»). Se contesta con 我姓… (wǒ xìng… = me apellido…):\n- 我姓王 (wǒ xìng Wáng = me apellido Wang)"],"姓":["xìng","xing4","apellido; apellidarse","V., Sust.","Funciona como verbo:\n- 我姓王 (wǒ xìng Wáng = me apellido Wang)"],"我":["wǒ","wo3","yo","Pron.",""],"呢":["ne","ne5","partícula de pregunta (¿y…?)","Part.","Va al final para devolver la pregunta:\n- 您呢？ (nín ne? = ¿y usted?)\nTono neutro."],"是":["shì","shi4","ser","V.","No se usa con adjetivos como el «ser» del español:\n- 我很好 (wǒ hěn hǎo = estoy bien)\nNo se dice 我是好 (wǒ shì hǎo)."],"吗":["ma","ma5","partícula interrogativa (sí/no)","Part.","Al final de la frase convierte la afirmación en pregunta. Tono neutro."],"不":["bù","bu4","no","Adv.","Antes de otro 4.º tono se pronuncia bú:\n- 不是 (bú shì = no es)\n- 不姓 (bú xìng = no se apellida)"],"同学":["tóngxué","tong2 xue2","compañero de clase","Sust.","Con 们 (men = plural) se usa para hablarle al grupo:\n- 同学们 (tóngxuémen = compañeros)"],"们":["men","men5","sufijo de plural (para personas)","sufijo","Hace plural, pero solo con personas:\n- 我们 (wǒmen = nosotros)\n- 他们 (tāmen = ellos)\n- 同学们 (tóngxuémen = compañeros)\nTono neutro."],"老师":["lǎoshī","lao3 shi1","maestro, maestra; profesor","Sust.","También va después del apellido, como trato:\n- 张老师 (Zhāng lǎoshī = profesor Zhang)"],"叫":["jiào","jiao4","llamar; llamarse","V.","Para presentarte:\n- 我叫… (wǒ jiào… = me llamo…)\nPara el apellido se usa 姓 (xìng = apellidarse)."],"你":["nǐ","ni3","tú","Pron.","Es informal. Para hablar con respeto se usa 您 (nín = usted)."],"什么":["shénme","shen2 me5","qué","P.I.","El 'me' es átono. Se queda donde iría la respuesta."],"名字":["míngzi","ming2 zi5","nombre","Sust.","El 'zi' es átono."],"哪国人":["nǎguórén","na3 guo2 ren2","¿de qué nacionalidad? / ¿de qué país es?","","Se contesta con el país + 人 (rén = persona):\n- 我是墨西哥人 (wǒ shì Mòxīgērén = soy mexicano)"],"哪":["nǎ","na3","cuál, qué (de una serie)","P.I.","No lo confundas con 那 (nà = ese): solo cambia el tono."],"国":["guó","guo2","país","Sust.","Va en los nombres de países:\n- 中国 (Zhōngguó = China)\n- 美国 (Měiguó = Estados Unidos)\n秘鲁 (Bìlǔ = Perú) no lo lleva."],"也":["yě","ye3","también","Adv.","Siempre va ANTES del verbo:\n- 我也是 (wǒ yě shì = yo también)"],"说":["shuō","shuo1","decir, hablar","V.","Para idiomas:\n- 说汉语 (shuō Hànyǔ = hablar chino)\n- 说英语 (shuō Yīngyǔ = hablar inglés)"],"英语":["Yīngyǔ","ying1 yu3","idioma inglés","Sust.","英 (yīng = Inglaterra) + 语 (yǔ = idioma). Ojo: en tu libro sale «Yingyǔ» sin tono; lo correcto es Yīngyǔ."],"还是":["háishi","hai2 shi5","o (en preguntas, entre opciones)","Conj.","Solo sirve para preguntar entre opciones:\n- 你是老师还是学生？ (nǐ shì lǎoshī háishi xuésheng? = ¿eres maestro o estudiante?)\nEn una afirmación se usa 或者 (huòzhě = o)."],"西班牙语":["Xībānyáyǔ","xi1 ban1 ya2 yu3","idioma español (hablado)","Sust.","西班牙 (Xībānyá = España) + 语 (yǔ = idioma)."],"都":["dōu","dou1","todos, ambos; todo","Adv.","Va antes del verbo:\n- 我们都说 (wǒmen dōu shuō = todos decimos)"],"只":["zhǐ","zhi3","sólo, solamente","Adv.","Va antes del verbo:\n- 我只说汉语 (wǒ zhǐ shuō Hànyǔ = solo hablo chino)"],"汉语":["Hànyǔ","han4 yu3","idioma chino (hablado)","Sust.","Literal: «idioma de los han» (el pueblo chino). 中文 (Zhōngwén) también es «idioma chino», sobre todo el escrito."],"他":["tā","ta1","él","Pron.","Suena igual que 她 (tā = ella) y 它 (tā = eso): los tres se dicen tā."],"她":["tā","ta1","ella","Pron.","Mismo sonido tā; solo cambia el carácter. Sirve para distinguir al escribir."],"墨西哥":["Mòxīgē","mo4 xi1 ge1","México","n. propio","Para decir «mexicano» se agrega 人 (rén = persona):\n- 墨西哥人 (Mòxīgērén = mexicano)"],"中国":["Zhōngguó","zhong1 guo2","China","n. propio","Literal: «país del centro». Para decir «chino» (la persona):\n- 中国人 (Zhōngguórén = chino, china)"],"秘鲁":["Bìlǔ","bi4 lu3","Perú","n. propio","Ojo: aquí el primer carácter se lee bì, no mì. Para decir «peruano»:\n- 秘鲁人 (Bìlǔrén = peruano)"],"阿根廷":["Āgēntíng","a1 gen1 ting2","Argentina","n. propio",""],"玻利维亚":["Bōlìwéiyà","bo1 li4 wei2 ya4","Bolivia","n. propio","Es el país, Bolivia (tu libro lo traduce como «boliviano»). Para decir «boliviano»:\n- 玻利维亚人 (Bōlìwéiyàrén = boliviano)"],"中国人":["Zhōngguórén","zhong1 guo2 ren2","chino, china (persona)","Sust.","中国 (Zhōngguó = China) + 人 (rén = persona)."],"墨西哥人":["Mòxīgērén","mo4 xi1 ge1 ren2","mexicano","Sust.",""],"阿根廷人":["Āgēntíngrén","a1 gen1 ting2 ren2","argentino","Sust.",""],"玻利维亚人":["Bōlìwéiyàrén","bo1 li4 wei2 ya4 ren2","boliviano","Sust.",""],"秘鲁人":["Bìlǔrén","bi4 lu3 ren2","peruano","Sust.",""],"我们":["wǒmen","wo3 men5","nosotros","Pron.","我 (wǒ = yo) + 们 (men = plural). El «men» es átono."],"认识":["rènshi","ren4 shi5","conocer (a alguien)","V.","El «shi» es átono.\n- 认识你很高兴 (rènshi nǐ hěn gāoxìng = encantado de conocerte)"],"很":["hěn","hen3","muy","Adv.","Va antes del adjetivo. A veces no significa «muy», solo une a la persona con el adjetivo:\n- 我很高兴 (wǒ hěn gāoxìng = estoy contento)"],"高兴":["gāoxìng","gao1 xing4","encantado, alegre, contento","Adj.",""],"在":["zài","zai4","(estar) en; en","Prep. y V.","Antes de otro verbo, dice dónde:\n- 我在公司工作 (wǒ zài gōngsī gōngzuò = trabajo en una compañía)\nSolo, significa «estar en»:\n- 我在家 (wǒ zài jiā = estoy en casa)"],"进出口":["jìnchūkǒu","jin4 chu1 kou3","importar y exportar; importación y exportación","","También salen por separado:\n- 进口 (jìnkǒu = importar)\n- 出口 (chūkǒu = exportar)"],"进口":["jìnkǒu","jin4 kou3","importar","V.","Literal: 'entrar por la puerta'."],"出口":["chūkǒu","chu1 kou3","exportar; salida","V.","Literal: 'salir por la puerta'. También es el letrero de SALIDA."],"公司":["gōngsī","gong1 si1","compañía, empresa","Sust.","El 'si' es átono."],"工作":["gōngzuò","gong1 zuo4","trabajar; empleo, trabajo","V. y Sust.","También es sustantivo:\n- 我的工作 (wǒ de gōngzuò = mi trabajo)"],"大学":["dàxué","da4 xue2","universidad","Sust.","大 (dà = grande) + 学 (xué = estudiar)."],"系":["xì","xi4","departamento (de una universidad), facultad","Sust.","Ejemplo:\n- 东亚学系 (Dōngyà xuéxì = Departamento de Estudios de Asia Oriental)"],"学习":["xuéxí","xue2 xi2","estudiar, aprender","V.","Más formal que 学 (xué = estudiar) solo; se usa para materias e idiomas:\n- 学习汉语 (xuéxí Hànyǔ = estudiar chino)"],"可以":["kěyǐ","ke3 yi3","poder (tener permiso); se puede","V.O.","Sirve para pedir o dar permiso:\n- 可以给你打电话吗？ (kěyǐ gěi nǐ dǎ diànhuà ma? = ¿te puedo llamar?)\nAl hablar suena ké yǐ."],"给":["gěi","gei3","dar; a, para (alguien)","Prep.","给 (gěi) + persona + verbo = hacer algo a alguien:\n- 给你打电话 (gěi nǐ dǎ diànhuà = llamarte)"],"打电话":["dǎdiànhuà","da3 dian4 hua4","hacer una llamada telefónica","","Literal: «golpear el teléfono». 打 (dǎ) solo = golpear, jugar."],"电话":["diànhuà","dian4 hua4","teléfono","Sust.","电 (diàn = electricidad) + 话 (huà = habla)."],"的":["de","de5","partícula posesiva (de)","Part.","A + 的 (de) + B = el B de A:\n- 我的书 (wǒ de shū = mi libro)\nTono neutro."],"我的":["wǒde","wo3 de5","mi, mío","","我 (wǒ = yo) + 的 (de = de)."],"我们的":["wǒmende","wo3 men5 de5","nuestro","","我们 (wǒmen = nosotros) + 的 (de = de)."],"号码":["hàomǎ","hao4 ma3","número","Sust.","Para teléfonos y documentos:\n- 电话号码 (diànhuà hàomǎ = número de teléfono)"],"零":["líng","ling2","cero","Num.","También se escribe 〇 (el cero gráfico)."],"发":["fā","fa1","enviar, mandar","V.","- 发电子邮件 (fā diànzǐ yóujiàn = mandar un correo)\n- 发短信 (fā duǎnxìn = mandar un mensaje de texto)"],"电子邮件":["diànzǐyóujiàn","dian4 zi3 you2 jian4","correo electrónico, e-mail","","Al hablar basta con 邮件 (yóujiàn = correo)."],"电子":["diànzǐ","dian4 zi3","electrónico(a)","Adj.","电 (diàn = electricidad) + 子 (zǐ = hijo): «hijo de la electricidad»."],"邮件":["yóujiàn","you2 jian4","correo","Sust.","邮 (yóu = correo postal) + 件 (jiàn = pieza)."],"这":["zhè","zhe4","este, esta, esto","Pron.","Es lo contrario de 那 (nà = ese, aquel)."],"女":["nǚ","nv3","femenino, mujer","Adj.","Va antes del sustantivo:\n- 女朋友 (nǚ péngyou = novia)\n- 女老师 (nǚ lǎoshī = maestra)"],"朋友":["péngyou","peng2 you5","amigo, amiga","Sust.","El «you» es átono.\n- 男朋友 (nán péngyou = novio)\n- 女朋友 (nǚ péngyou = novia)"],"请":["qǐng","qing3","invitar; por favor","V.","- 请坐 (qǐng zuò = siéntese, por favor)\n- 我请你 (wǒ qǐng nǐ = te invito)"],"进":["jìn","jin4","entrar","V.","Lo contrario es 出 (chū = salir)."],"坐":["zuò","zuo4","sentarse; viajar (en un medio)","V.","- 请坐 (qǐng zuò = siéntese)\n- 坐飞机 (zuò fēijī = viajar en avión)"],"谢谢":["xièxie","xie4 xie5","agradecer; gracias","V.","El segundo «xie» es átono.\n- 谢谢你 (xièxie nǐ = gracias a ti)"],"喝":["hē","he1","beber, tomar","V.","- 喝什么？ (hē shénme? = ¿qué toma?)"],"茶":["chá","cha2","té","Sust.","De ahí 'cha' en otras lenguas."],"哪儿":["nǎr","na3 r5","dónde","P.I.","También se dice 哪里 (nǎli). 哪儿 (nǎr) se oye más en el norte; 哪里 (nǎli) es más formal. No lo confundas con 那儿 (nàr = allí)."],"学院":["xuéyuàn","xue2 yuan4","instituto, facultad, escuela superior","Sust.","学 (xué = estudiar) + 院 (yuàn = recinto)."],"怎么样":["zěnmeyàng","zen3 me5 yang4","cómo, qué tal","P.I.","El «me» es átono. Sirve para saludar:\n- 你怎么样？ (nǐ zěnmeyàng? = ¿cómo estás?)"],"大":["dà","da4","grande","Adj.","Lo contrario es 小 (xiǎo = pequeño)."],"漂亮":["piàoliang","piao4 liang5","hermoso, bonito","Adj.","El 'liang' es átono. Para personas y cosas."],"喜欢":["xǐhuan","xi3 huan5","gustar, querer","V.","El orden es al revés que en español:\n- 我喜欢茶 (wǒ xǐhuan chá = me gusta el té; literal «yo gusto té»)\nEl «huan» es átono."],"那":["nà","na4","ese, esa, eso, aquel","Pron.","Es lo contrario de 这 (zhè = este)."],"男":["nán","nan2","masculino, hombre","Adj.","Ejemplo:\n- 男朋友 (nán péngyou = novio)"],"小":["xiǎo","xiao3","pequeño, chico","Adj." hénme = qué). El «me» es átono."],"为":["wèi","wei4","para, por (a favor de)","Prep.","Ejemplo:\n- 为你 (wèi nǐ = para ti)"],"分公司":["fēngōngsī","fen1 gong1 si1","sucursal de una compañía","","分 (fēn = dividir, sección) + 公司 (gōngsī = compañía)."],"老板":["lǎobǎn","lao3 ban3","patrón, jefe, dueño","Sust.","Literal 'tabla vieja' (el que pone el cartel del negocio)."],"让":["ràng","rang4","dejar, permitir; hacer que (alguien haga algo)","V.","让 (ràng) + persona + verbo:\n- 让我去 (ràng wǒ qù = me deja ir, o me manda ir)"],"那儿":["nàr","na4 r5","allí, allá","Pron.","También se dice 那里 (nàli). Lo contrario es 这儿 (zhèr = aquí)."],"百":["bǎi","bai3","cien","Num.","Ejemplo:\n- 两百 (liǎng bǎi = doscientos)"],"少":["shǎo","shao3","poco, pocos","Adj.","Lo contrario es 多 (duō = mucho). En 多少 (duōshao = cuánto) se dice sin tono; solo, se dice shǎo."],"因为":["yīnwèi","yin1 wei4","porque","Conj.","Suele ir en pareja con 所以 (suǒyǐ = por eso)."],"浙江":["Zhèjiāng","zhe4 jiang1","Zhejiang (provincia de China)","n. propio","Para decir «de Zhejiang» se agrega 人 (rén = persona):\n- 浙江人 (Zhèjiāngrén = de Zhejiang)"],"地图":["dìtú","di4 tu2","mapa","Sust.","地 (dì = tierra) + 图 (tú = imagen). Su clasificador es 张 (zhāng):\n- 一张地图 (yì zhāng dìtú = un mapa)"],"张":["zhāng","zhang1","clasificador para papel, mapas, boletos, fotos","P.M.","También es apellido:\n- 张老师 (Zhāng lǎoshī = profesor Zhang)\nComo clasificador:\n- 一张地图 (yì zhāng dìtú = un mapa)\n- 两张票 (liǎng zhāng piào = dos boletos)"],"中文":["Zhōngwén","zhong1 wen2","idioma chino (escrito)","Sust.","Se usa sobre todo para lo escrito; para lo hablado se dice 汉语 (Hànyǔ)."],"西班牙文":["Xībānyáwén","xi1 ban1 ya2 wen2","idioma español (escrito)","Sust.","Con 文 (wén = escritura) es el idioma escrito; 西班牙语 (Xībānyáyǔ) es lo mismo con 语 (yǔ = idioma)."],"看":["kàn","kan4","mirar, ver; leer","V.","- 看书 (kàn shū = leer un libro)\n- 看电视 (kàn diànshì = ver la tele)"],"一下":["yíxià","yi2 xia4","un poco, una vez (medida verbal)","P.M.","Va DESPUÉS del verbo y suaviza:\n- 看一下 (kàn yíxià = echar un vistazo)\n- 等一下 (děng yíxià = espera un momento)"],"行":["xíng","xing2","estar bien, servir, valer","V.","Para aceptar:\n- 行！ (xíng! = ¡va!)\nSu negación es 不行 (bù xíng = no se puede)."],"要":["yào","yao4","querer (algo); querer (hacer); ir a (futuro)","V. y V.O.","要 (yào) + cosa = querer algo; 要 (yào) + verbo = ir a hacer algo. Es más tajante que 想 (xiǎng = querer)."],"干":["gàn","gan4","hacer (trabajo, actividad)","V.","Se usa para trabajo y actividades:\n- 你干什么？ (nǐ gàn shénme? = ¿qué haces?)\nPara «hacer» en general se usa 做 (zuò)."],"是的":["shìde","shi4 de5","sí, así es","","El 'de' es átono. Confirma lo que dijo el otro."],"玩儿":["wánr","wan2 r5","jugar, divertirse, hacer algo por placer","V.","Se lee wánr, en una sola sílaba (no «wán-er»)."],"知道":["zhīdao","zhi1 dao5","saber (un dato), conocer","V.","El «dao» es átono. 知道 (zhīdao) = saber un dato; 认识 (rènshi) = conocer a una persona."],"比较":["bǐjiào","bi3 jiao4","comparativamente, relativamente","Adv.","Suaviza el adjetivo:\n- 比较好 (bǐjiào hǎo = bastante bien)\nEs menos que 很好 (hěn hǎo = muy bien)."],"真":["zhēn","zhen1","realmente, de verdad","Adv.","Va antes del adjetivo:\n- 真好 (zhēn hǎo = qué bien, de verdad)"],"有意思":["yǒuyìsi","you3 yi4 si5","interesante, divertido","Adj.","Literal: «tener sentido». Lo contrario es 没意思 (méi yìsi = aburrido)."],"意思":["yìsi","yi4 si5","significado, sentido","Sust.","El «si» es átono.\n- 什么意思？ (shénme yìsi? = ¿qué significa?)"],"龙":["lóng","long2","dragón","Sust.","En China es símbolo de poder y buena suerte, no de maldad."],"山":["shān","shan1","montaña, colina","Sust.",""],"词典":["cídiǎn","ci2 dian3","diccionario","Sust.","词 (cí = palabra) + 典 (diǎn = obra de consulta). Su clasificador es 本 (běn)."],"汉西词典":["Hàn-Xī cídiǎn","han4 xi1 ci2 dian3","diccionario chino-español","","汉 (Hàn = chino) + 西 (Xī = español): el orden dice qué idioma va primero."],"西汉词典":["Xī-Hàn cídiǎn","xi1 han4 ci2 dian3","diccionario español-chino","","Al revés que 汉西词典 (Hàn-Xī cídiǎn): primero español, 西 (Xī), y luego chino, 汉 (Hàn)."],"本":["běn","ben3","clasificador para libros, cuadernos, diccionarios","P.M.","Ejemplo:\n- 一本书 (yì běn shū = un libro)\nSolo, también significa «raíz»."],"谁":["shéi","shei2","quién","P.I.","También se pronuncia shuí. Las dos lecturas son válidas; shéi es la más coloquial. Se queda donde iría la respuesta."],"请问":["qǐngwèn","qing3 wen4","disculpe, ¿me permite preguntar?","","Fórmula fija para abrir una pregunta a un desconocido."],"问":["wèn","wen4","preguntar","V.",""],"对":["duì","dui4","correcto, sí (confirmando)","Adj.","- 对！ (duì! = ¡correcto!)\nEn otras lecciones también significa «hacia, con»."],"非常":["fēicháng","fei1 chang2","muy, muchísimo","Adv.","Más fuerte y más formal que 很 (hěn = muy). Va antes del adjetivo."],"有用":["yǒuyòng","you3 yong4","útil","Adj.","Literal: «tener uso». Lo contrario es 没用 (méi yòng = no sirve)."],"能":["néng","neng2","poder (capacidad o posibilidad)","V.O.","Habla de capacidad o posibilidad. No lo confundas con:\n- 会 (huì = saber hacer algo aprendido)\n- 可以 (kěyǐ = tener permiso)"],"用":["yòng","yong4","usar","V.","De aquí sale 有用 (yǒuyòng = útil)."],"当然":["dāngrán","dang1 ran2","por supuesto, claro","Adv.","Para decir que sí:\n- 当然可以 (dāngrán kěyǐ = claro que sí)"],"书":["shū","shu1","libro","Sust.","Su clasificador es 本 (běn):\n- 一本书 (yì běn shū = un libro)"],"本子":["běnzi","ben3 zi5","libreta, cuaderno","Sust.","El «zi» es átono. Viene de 本 (běn), el clasificador de libros."],"笔":["bǐ","bi3","pluma, bolígrafo, lápiz","Sust.","Su clasificador es 支 (zhī):\n- 一支笔 (yì zhī bǐ = una pluma)"],"支":["zhī","zhi1","clasificador para objetos alargados (pluma, bolígrafo)","P.M.","También sirve para canciones:\n- 一支歌 (yì zhī gē = una canción)"],"教室":["jiàoshì","jiao4 shi4","aula, salón de clases","Sust.","教 (jiào = enseñar) + 室 (shì = cuarto)."],"上课":["shàngkè","shang4 ke4","asistir a clases, tener clase","","Literal: «subir a la lección». Lo contrario es 下课 (xiàkè = terminar la clase)."],"北京":["Bě function migra(x){   // pasa las claves viejas a las nuevas; sirve para lo guardado aquí y para lo que llega de la nube
  if(!x) return x;
  for(const k of ['hechas','sellos']){ const o=x[k]; if(!o) continue;
    for(const id of Object.keys(o)){ const m=id.match(/^(\d+)-(\d+)$/); if(!m) continue;
      const n=UID_V1[+m[1]] && UID_V1[+m[1]]+'-'+m[2]; if(n && !(n in o)) o[n]=o[id]; delete o[id]; } }

function srsResponde(clave, ok){
  if(!clave) return;
  const r = S.srs[clave] || (S.srs[clave]={iv:0,due:hoy(),n:0,f:0});
  if(!ok){ r.iv=0; r.due=hoy(); r.f++; L.srsTocado.add(clave); return; }
  r.n++;
  if(L.srsTocado.has(clave)){ if(r.iv===0) r.due=masDias(1); return; }
  L.srsTocado.add(clave);
  r.iv = r.iv<1 ? 1 : Math.min(180, Math.round(r.iv*2.3));
  r.due = masDias(r.iv);
}

const SALIR_BANCO=3, MAX_BANCO_HOY=5;
const claveError=e=> e.w ? 'p:'+e.w : e.hz ? 'h:'+e.hz : e.tipo==='par' ? 'r:'+e.p.h
  : e.tipo==='frase' ? 'f:'+e.f[0] : e.tipo==='dialogo' ? 'd:'+e.d.lineas[e.i][1] : null;
function bancoResponde(e, ok){
  const k=claveError(e); if(!k) return;
  const r=S.errores[k];
  if(!ok){ const x=r||(S.errores[k]={f:0,ok:0,dia:null,fallo:null}); x.f++; x.ok=0; x.dia=null; x.fallo=hoy(); return; }
  if(!r || r.fallo===hoy() || r.dia===hoy()) return;
  r.ok++; r.dia=hoy();
  if(r.ok>=SALIR_BANCO){ delete S.errores[k]; S.salidos[k]=hoy(); L.graduados.push(k); }
}
// Arma un ejercicio a partir de una clave (del repaso o del banco). null si ya no existe en los datos.
function ejercicioDe(k){
  const t=k[0], x=k.slice(2), una=a=>a[Math.floor(Math.random()*a.length)], iv=(S.srs[k]||{}).iv||0;
  if(t==='p'){ if(!P[x]) return null;
    return {tipo:una(palConTono(x) ? (iv>=3 ? ['pal-elige','pal-escribe','pal-tono','pal-escribe'] : ['pal-sig','pal-elige','pal-tono']) : ['pal-sig','pal-elige']), w:x, pool:Object.keys(P)}; }
  if(t==='h'){ if(!C[x]) return null;
    return {tipo:una(conTono(x) ? (iv>=3 ? ['hanzi','escribe','tono'] : ['significado','hanzi','tono']) : ['significado','hanzi']), hz:x, pool:Object.keys(C)}; }
  if(t==='r'){ const p=UNIDADES.flatMap(u=>u.pares||[]).find(p=>p.h===x); return p ? {tipo:'par',p} : null; }
  if(t==='f'){ const f=UNIDADES.flatMap(u=>u.frases||[]).find(f=>f[0]===x); return f ? {tipo:'frase',f} : null; }
  if(t==='d'){ for(const u of UNIDADES) for(const d of u.dialogos||[]){ const i=d.lineas.findIndex(l=>l[1]===x && l[4]); if(i>=0) return {tipo:'dialogo',d,i}; } }
  return null;
}
// Sorteo con peso: lo que más has fallado sale más seguido. No repite lo que ya contó hoy.
function erroresParaHoy(excluir){
  const cand=Object.entries(S.errores).filter(([k,r])=>!excluir.has(k) && r.fallo!==hoy() && r.dia!==hoy()), out=[];
  while(cand.length && out.length<MAX_BANCO_HOY){
    let z=Math.random()*cand.reduce((s,[,r])=>s+r.f,0), i=0;
    while(i<cand.length-1 && (z-=cand[i][1].f)>0) i++;
    const [k]=cand.splice(i,1)[0], e=ejercicioDe(k);
    if(e){ e.banco=true; out.push(e); }
  }
  return out;
}

let AC=null, BUF={}, INI={}, cargandoSon=null;   // INI: segundos de silencio al inicio de cada muestra (se saltan)
function audio(){ try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); }catch(e){ AC=null; } return AC; }
function cargaSonidos(){
  if(cargandoSon) return cargandoSon;
  return cargandoSon=fetch('sonidos.json').then(r=>r.json()).then(j=>Promise.all(Object.entries(j).map(([k,b64])=>{
    const bin=atob(b64), u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
    return new Promise(ok=>audio().decodeAudioData(u.buffer,b=>{ BUF[k]=b;
      const d=b.getChannelData(0); let i=0; while(i<d.length && Math.abs(d[i])<.02) i++; INI[k]=i<d.length ? i/b.sampleRate : 0; ok(); },()=>ok()));
  }))).catch(()=>{ cargandoSon=null; });
}
function efecto(nombre, retraso){
  if(!S.sonido) return;
  const c=audio(); if(!c) return;
  if(!Object.keys(BUF).length){ cargaSonidos(); return; }
  const t0=c.currentTime+(retraso||0);
  for(const [n,t,r,v] of EFECTOS[nombre]){ if(!BUF[n]) continue;
    const s=c.createBufferSource(), g=c.createGain(); s.buffer=BUF[n]; s.playbackRate.value=r; g.gain.value=v; s.connect(g).connect(c.destination); s.start(t0+t, INI[n]||0); }
}

// ---------- voz ----------
// Primero los clips propios de voz/ (Azure, voz Xiaoxiao, generados con herramientas/audio.py):
// misma voz en todos los dispositivos. Si falta el clip, la voz china del dispositivo; si tampoco hay, avisa.
let VOZ_IDX=null, cargandoVoz=null, vozSonando=null, vozAvisado=false, vozPedido=0;
const VOZ_BUF={}, VOZ_INI={};
function cargaIndiceVoz(){
  return cargandoVoz || (cargandoVoz=fetch('voz/indice.json').then(r=>r.ok?r.json():{}).then(j=>VOZ_IDX=j)
    .catch(()=>{ cargandoVoz=null; return {}; }));
}
function clipVoz(t){
  if(VOZ_BUF[t]) return Promise.resolve(VOZ_BUF[t]);
  return cargaIndiceVoz().then(idx=>{ const f=idx[t], c=audio(); if(!f || !c) return null;
    return fetch('voz/'+f).then(r=>r.ok?r.arrayBuffer():null).then(ab=>ab && new Promise(ok=>c.decodeAudioData(ab,b=>{
      // los mp3 traen un poco de silencio al inicio: se salta para que suene al instante
      const d=b.getChannelData(0); let i=0; while(i<d.length && Math.abs(d[i])<.01) i++;
      VOZ_INI[t]=i<d.length ? Math.max(0,i/b.sampleRate-.02) : 0; VOZ_BUF[t]=b; ok(b); },()=>ok(null))));
  }).catch(()=>null);
}
function habla(t){
  const c=audio(), n=++vozPedido;   // audio() aquí, dentro del toque: iOS solo deja sonar así
  if(vozSonando){ try{ vozSonando.stop(); }catch(e){} vozSonando=null; }
  try{ if('speechSynthesis' in window) speechSynthesis.cancel(); }catch(e){}
  // Si ya se sabe que no hay clip, la voz del dispositivo va sin esperar (iOS la exige dentro del toque).
  if(VOZ_IDX && !VOZ_IDX[t]){ vozDispositivo(t); return; }
  clipVoz(t).then(b=>{ if(n!==vozPedido) return;   // ya se pidió otra cosa
    if(!b || !c){ vozDispositivo(t); return; }
    const s=c.createBufferSource(); s.buffer=b; s.connect(c.destination); s.start(0, VOZ_INI[t]||0); vozSonando=s; });
}
function vozDispositivo(t){
  try{ if(!('speechSynthesis' in window)){ sinVoz(t); return; }
    const vs=speechSynthesis.getVoices(), v=vs.find(v=>/^zh[-_]CN/i.test(v.lang)) || vs.find(v=>/^zh/i.test(v.lang));
    if(!v && vs.length){ sinVoz(t); return; }   // hay voces, pero ninguna china (p. ej. Windows sin el paquete)
    const u=new SpeechSynthesisUtterance(t); u.lang='zh-CN'; u.rate=.8; if(v) u.voice=v; speechSynthesis.speak(u);
  }catch(e){ sinVoz(t); }
}
function sinVoz(t){ if(vozAvisado) return; vozAvisado=true;
  muestraError('No tengo el audio de «'+t+'» y este dispositivo no tiene voz china.'); }
cargaIndiceVoz();
try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices(); }catch(e){}

const mezcla=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const toma=(a,n)=>mezcla(a).slice(0,n);
const aprendidosHasta=ui=>UNIDADES.slice(0,ui+1).flatMap(u=>u.hz);
const conTono=hz=>C[hz].pn.slice(-1)!=='5';

const palabrasHasta=ui=>UNIDADES.slice(0,ui+1).flatMap(u=>u.pal||[]);
const silabas=pal=>P[pal].pn.split(' ');
const palConTono=pal=>silabas(pal).some(s=>s.slice(-1)!=='5');

function armaLeccionLibro(ui,l){
  const u=UNIDADES[ui], mitad=Math.ceil(u.pal.length/2), pool=palabrasHasta(ui);
  if(l<2){
    const nuevos = l===0 ? u.pal.slice(0,mitad) : u.pal.slice(mitad);
    const primero = nuevos.flatMap(w=>[{tipo:'pal-intro',w},{tipo:'pal-sig',w,pool}]);
    const resto = mezcla([ ...nuevos.map(w=>({tipo:'pal-elige',w,pool})),
                           ...(l===1 ? toma(nuevos.filter(palConTono),3).map(w=>({tipo:'pal-tono',w})) : []) ]);
    return [...primero, ...resto];
  }
  return mezcla([ ...toma(u.pal,3).map(w=>({tipo:'pal-elige',w,pool})),
                  ...toma(u.pal,2).map(w=>({tipo:'pal-sig',w,pool})),
                  ...toma(u.pal.filter(palConTono),2).map(w=>({tipo:'pal-tono',w})),
                  ...toma(u.pal.filter(palConTono),3).map(w=>({tipo:'pal-escribe',w})),
                  ...toma(u.frases,2).map(f=>({tipo:'frase',f})),
                  ...toma(lineasDialogo(u),2) ]);
}
// Ejercicio "¿qué contesta?": una línea con trampas de un diálogo de la unidad.
const lineasDialogo=u=>(u.dialogos||[]).flatMap((d,di)=>d.lineas.map((x,i)=>x[4]?{tipo:'dialogo',d,i}:null).filter(Boolean));

function armaLeccion(ui,l){
  if(UNIDADES[ui].libro) return armaLeccionLibro(ui,l);
  const u=UNIDADES[ui], mitad=Math.ceil(u.hz.length/2), pool=aprendidosHasta(ui);
  if(l<2){
    const nuevos = l===0 ? u.hz.slice(0,mitad) : u.hz.slice(mitad);
    const primero = nuevos.flatMap(hz=>[{tipo:'intro',hz},{tipo:'significado',hz,pool}]);
    const resto = mezcla([ ...nuevos.map(hz=>({tipo:'hanzi',hz,pool})),
                           ...(l===1 ? toma(nuevos.filter(conTono),3).map(hz=>({tipo:'tono',hz})) : []) ]);
    return [...primero, ...resto];
  }
  return mezcla([ ...toma(u.hz,3).map(hz=>({tipo:'hanzi',hz,pool})),
                  ...toma(u.hz.filter(conTono),2).map(hz=>({tipo:'tono',hz})),
                  ...toma(u.hz.filter(conTono),3).map(hz=>({tipo:'escribe',hz})),
                  ...toma(u.pares,3).map(p=>({tipo:'par',p})),
                  ...toma(u.frases,2).map(f=>({tipo:'frase',f})) ]);
}

// ---------- diagnóstico de fluidez (solo si la dirección lo pide; sin eso no hace nada) ----------
//   ?fps            → un contador arriba a la izquierda: cuadros por segundo y el cuadro más lento del último segundo
//   ?sin=3d         → sin motor 3D (sello plano, sin sobre) · ?sin=textura → la carta sin el grano del papel · ?sin=3d,textura → sin los dos
// Sirve para ubicar en el iPhone qué es lo que pesa: se abre la misma app con y sin cada cosa y se compara.
(()=>{ const q=new URLSearchParams(location.search), sin=(q.get('sin')||'').split(',');
  if(sin.includes('3d')) window.__sin3d=true;
  if(sin.includes('textura')) document.documentElement.classList.add('sin-textura');
  if(!q.has('fps')) return;
  const d=document.createElement('div'); d.style.cssText='position:fixed;left:4px;top:4px;z-index:99;padding:2px 6px;border-radius:4px;background:#000c;color:#7f7;font:12px/1.3 monospace;pointer-events:none';
  addEventListener('load',()=>document.body.appendChild(d));
  let n=0, peor=0, ant=performance.now(), t0=ant;
  (function paso(ahora){ n++; peor=Math.max(peor,ahora-ant); ant=ahora;
    if(ahora-t0>=1000){ d.textContent=Math.round(n*1000/(ahora-t0))+' fps · peor '+Math.round(peor)+' ms'; d.style.color= peor>50?'#f77':peor>25?'#fd6':'#7f7'; n=0; peor=0; t0=ahora; }
    requestAnimationFrame(paso); })(ant);
})();
//   ?lag            → cuánto tarda la app en responder al botón de abajo («Comprobar», «Continuar»), en ms desde que se suelta el dedo:
//                     el código, cuándo sale en pantalla, cuándo empieza a deslizarse la carta, el golpe del sello y el cuadro más lento
const LAG=(()=>{ if(!new URLSearchParams(location.search).has('lag')) return null;
  const d=document.createElement('div'); d.style.cssText='position:fixed;right:4px;top:4px;z-index:99;padding:3px 7px;border-radius:4px;background:#000d;color:#fd6;font:11px/1.4 monospace;pointer-events:none;max-width:62vw';
  addEventListener('load',()=>document.body.appendChild(d));
  let t0=0, filas=[], vuelta=0;
  const pon=()=>{ d.textContent=filas.join(' · '); };
  const m={
    empieza(ts){ t0=ts||performance.now(); filas=[]; const yo=++vuelta; let ant=performance.now(), peor=0;
      (function paso(ahora){ if(yo!==vuelta) return; const g=ahora-ant; peor=Math.max(peor,g); ant=ahora;
        if(g>34) filas.push('tirón '+Math.round(g)+' ms a los '+Math.round(ahora-t0)), pon();
        if(ahora-t0<1500) requestAnimationFrame(paso); else { filas.push('cuadro más lento '+Math.round(peor)+' ms'); pon(); } })(ant);
      requestAnimationFrame(()=>requestAnimationFrame(()=>m.marca('en pantalla'))); },
    marca(n){ if(!t0) return; filas.push(n+' '+Math.round(performance.now()-t0)+' ms'); pon(); }
  };
  return m;
})();

let L=null;
const $=id=>document.getElementById(id);
function empezar(ui,l){ empezarCola(armaLeccion(ui,l),{modo:'leccion',ui,l,titulo:UNIDADES[ui].t+' · '+NOMBRES[l]}); }
// ---------- rediseño: el mazo de cartas y las piezas 3D (HANDOFF §24) ----------
// El motor 3D (piezas.js + tres/) se baja la primera vez que entras a una lección. Si no se puede (teléfono sin 3D, falta un archivo,
// página de pruebas), MOTOR se queda en null y la app usa el sello plano de siempre.
let MOTOR=null, motorPide=null;
// Pantallas grandes (iPad, computadora): la lección entera se agranda pareja (letras, carta, botones y piezas 3D) hasta llenar la pantalla,
// con la misma proporción que en el teléfono. ESC = cuántas veces más grande se ve (1 en un teléfono: ahí no se toca nada).
// Se hace con transform:scale sobre #leccion; por dentro todo sigue midiendo lo mismo que en el teléfono.
let ESC=1;
function ajustaEscala(){
  const lec=$('leccion'), w=document.documentElement.clientWidth, h=innerHeight, k=Math.min(w/400, h/800, 2.2);   // 400 × 800: el tamaño de teléfono para el que está pensada la carta
  ESC = k>1.05 ? k : 1;
  lec.style.transformOrigin='0 0'; lec.style.transform = ESC>1 ? `scale(${ESC})` : '';
  lec.style.width = ESC>1 ? (w/ESC)+'px' : ''; lec.style.minHeight = ESC>1 ? (h/ESC)+'px' : '';
}
addEventListener('resize',()=>{ if(L) ajustaEscala(); });
// Dónde está un elemento, en medidas de la lección (las del lienzo 3D y de todo lo que vive dentro de #leccion), no de la pantalla
function rectL(el){ const b=el.getBoundingClientRect(), o=$('lienzo3d').getBoundingClientRect();
  return {left:(b.left-o.left)/ESC, top:(b.top-o.top)/ESC, width:b.width/ESC, height:b.height/ESC}; }
// el ancho que tiene la lección para acomodar una palabra
const ANCHO=()=>Math.min(432, innerWidth/ESC);
const QUIETO=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
function preparaMotor(){
  if(window.__sin3d) return Promise.resolve();   // la hoja de pruebas lo apaga: sus toques no esperan al golpe del sello
  return motorPide || (motorPide=import('./piezas.js').then(m=>m.creaMotor($('lienzo3d'), Object.assign({ligero:/[?&]3d=ligero/.test(location.search)}, window.__motor3d||{}))).then(m=>m.carga()).then(m=>{ MOTOR=m; precargaHuellas(m); }).catch(()=>{ MOTOR=null; }));
}
// Las huellas del sello (las imágenes que deja en el papel) se bajan y se decodifican en cuanto está el motor. Antes se pedían al acertar:
// el teléfono tenía que leer y descomprimir la imagen justo cuando el bloque iba a caer. Se guardan en HUELLAS para que no se suelten.
const HUELLAS=[];
function precargaHuellas(m){
  try{ const n=((m.conf.piezas.sello||{}).caras||[]).length;
    const cw=$('ej').offsetWidth || Math.min(400,innerWidth-32), d=m.dondeHuella('sello',cw);
    let cola=Promise.resolve();
    for(let k=0;k<n;k++){ const src=m.huella('sello',k); if(!src) continue; const im=new Image(); im.src=src; HUELLAS.push(im); if(im.decode) im.decode().catch(()=>{});
      cola=cola.then(()=>new Promise(r=>setTimeout(r,60))).then(()=>horneaHuella(src,d.width,d.height)).catch(()=>{}); }   // una por una, sin trabar la app
  }catch(e){}
}
// Hornea la huella: le aplica UNA vez el filtro de tinta (#tinta: tres capas de ruido que la deforman y le dan grano) y la guarda como imagen normal.
// Antes el filtro iba en vivo sobre la imagen y Safari lo recalculaba al aparecer (golpe), con el temblor de la carta y al copiarla para deslizarla:

async function horneaHuella(src,w,h){
