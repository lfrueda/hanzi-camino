<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>汉字 · Camino</title>
<meta name="theme-color" content="#e8e5dc">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  @font-face{font-family:"Kai";src:url(kai.woff2) format("woff2");font-display:swap}
  :root{
    --paper:#e8e5dc; --sheet:#f3f1ea; --ink:#1d1b18; --ink2:#4a463e; --muted:#7b7568; --line:#cfc9bb;
    --seal:#b5312b; --jade:#2f6b4c; --kai:"Kai",KaiTi,STKaiti,"Kaiti SC",serif;
    --cjk:var(--kai);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
  .wrap{max-width:560px;margin:0 auto;padding:0 18px}
  .cjk{font-family:var(--kai)}
  /* ---------- camino ---------- */
  #camino header{position:sticky;top:0;background:#e8e5dcf2;backdrop-filter:blur(4px);z-index:2;
    display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1.5px solid var(--ink)}
  #camino header h1{margin:0;font-family:var(--kai);font-size:30px;font-weight:400;letter-spacing:4px}
  .chips{display:flex;gap:16px;font-weight:700;font-size:15px;align-items:center}
  .ajuste{display:inline-flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:700;line-height:1;color:var(--ink2);min-width:40px}
  .ajuste i{width:30px;height:30px;display:flex;align-items:center;justify-content:center;
    border-radius:5px;background:var(--seal);color:#f6e9e4;transform:rotate(-6deg);box-shadow:inset 0 0 0 2px var(--seal),inset 0 0 0 3.5px #f6e9e4;
    transition:transform .15s,background .15s}
  .ajuste i svg{width:18px;height:18px}
  .ajuste:active i{transform:rotate(-6deg) scale(.9)}
  .ajuste.off{color:var(--muted)}
  .ajuste.off i{background:transparent;color:var(--muted);box-shadow:none;border:1.5px dashed var(--line);transform:none}
  /* etiqueta de qué es lo que ves: radical, hanzi, palabra, frase, pregunta, diálogo */
  .tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--seal);border:1.5px solid var(--seal);padding:2px 8px;margin-bottom:6px}
  .tag + br + .intro{display:block;margin-top:14px}
  .ico{display:inline-block;width:1.1em;height:1.1em;vertical-align:-.18em}
  .oir{gap:7px}
  .bocina{color:var(--ink2);padding:6px}
  /* diálogo propio (en vez del confirm del navegador) */
  #dlg{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:#1d1b1866}
  #dlg.on{display:flex;animation:dlgFondo .18s ease-out}
  #dlg .caja{width:100%;max-width:560px;background:var(--paper);border-top:2px solid var(--ink);padding:26px 20px calc(18px + env(safe-area-inset-bottom));
    position:relative;animation:dlgSube .22s ease-out}
  #dlg .caja::before{content:"";position:absolute;left:12px;top:0;bottom:0;width:1.5px;background:var(--seal);opacity:.5}
  #dlg .sellod{position:absolute;right:20px;top:-24px;width:52px;height:52px;border-radius:6px;background:var(--seal);color:#f6e9e4;font-family:var(--kai);
    font-size:30px;display:flex;align-items:center;justify-content:center;transform:rotate(-8deg);box-shadow:inset 0 0 0 3px var(--seal),inset 0 0 0 5px #f6e9e4}
  #dlg h3{margin:0 70px 6px 10px;font-size:20px} #dlg p{margin:0 0 18px 10px;color:var(--ink2);line-height:1.45}
  #dlg .bots{display:flex;gap:10px} #dlg .bots .btn{flex:1}
  #dlg .btn.sec{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
  #dlg .btn.peligro{background:var(--seal)}
  @keyframes dlgSube{from{transform:translateY(100%)}to{transform:none}}
  @keyframes dlgFondo{from{background:#1d1b1800}to{background:#1d1b1866}}
  @media (prefers-reduced-motion:reduce){#dlg.on,#dlg .caja{animation:none}}
  .chips .ajustes{display:flex;gap:6px}
  .unidad{margin:24px 0 8px;background:var(--sheet);padding:16px 16px 14px 22px;border:1.5px solid var(--ink);position:relative}
  .unidad::before{content:"";position:absolute;left:10px;top:0;bottom:0;width:1.5px;background:var(--seal);opacity:.55}
  .unidad.locked{opacity:.5}
  .unidad .num{font-family:var(--kai);font-size:22px;color:var(--seal)}
  .unidad h2{margin:0;font-size:17px}
  .unidad p{margin:3px 0 0;color:var(--muted);font-size:14px}
  .unidad .rads{font-family:var(--kai);font-size:24px;margin-top:6px;letter-spacing:8px}
  .lecciones{display:flex;justify-content:space-around;padding:16px 0 2px}
  .nodo{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
  .cuadro{width:66px;height:66px;display:flex;align-items:center;justify-content:center;font-family:var(--kai);font-size:34px;
    border:1.5px dashed var(--line);color:var(--line);position:relative;
    background:linear-gradient(to right,transparent 49.5%,#cfc9bb66 49.5%,#cfc9bb66 50.5%,transparent 50.5%),
               linear-gradient(to bottom,transparent 49.5%,#cfc9bb66 49.5%,#cfc9bb66 50.5%,transparent 50.5%)}
  .nodo.now .cuadro{background:var(--ink);color:var(--sheet);border:1.5px solid var(--ink)}
  .nodo.now{color:var(--ink);font-weight:700}
  .nodo.done .cuadro{background:var(--seal);color:#f6e9e4;border:none;border-radius:6px;transform:rotate(-5deg);
    box-shadow:inset 0 0 0 3px var(--seal),inset 0 0 0 5px #f6e9e4}
  .nodo:disabled{cursor:default}
  .pie{color:var(--muted);font-size:13px;text-align:center;margin:30px 0 40px}
  .pie button{color:var(--ink2);text-decoration:underline;margin:0 6px}
  /* ---------- lección ---------- */
  #leccion{display:none;min-height:100vh;flex-direction:column}
  .top{display:flex;align-items:center;gap:14px;padding:18px}
  .top .x{font-size:22px;color:var(--ink2);width:28px}
  .barra{flex:1;height:8px;background:var(--line)}
  .barra i{display:block;height:100%;width:0;background:var(--ink);transition:width .35s}
  .ej{flex:1;padding:4px 18px 170px}
  .ej h3{margin:4px 0 14px;font-size:19px;font-weight:600}
  .mizi{width:200px;height:200px;margin:8px auto 18px;position:relative;border:2px solid var(--seal);background:
      linear-gradient(to right,transparent 49.6%,#b5312b55 49.6%,#b5312b55 50.4%,transparent 50.4%),
      linear-gradient(to bottom,transparent 49.6%,#b5312b55 49.6%,#b5312b55 50.4%,transparent 50.4%),
      linear-gradient(45deg,transparent 49.7%,#b5312b30 49.7%,#b5312b30 50.3%,transparent 50.3%),
      linear-gradient(-45deg,transparent 49.7%,#b5312b30 49.7%,#b5312b30 50.3%,transparent 50.3%)}
  .mizi>span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--kai);font-size:160px;line-height:1}
  .sello{position:absolute;right:-22px;bottom:-18px;width:60px;height:60px;border-radius:6px;background:var(--seal);color:#f6e9e4;
    font-family:var(--kai);font-style:normal;font-size:34px;display:flex;align-items:center;justify-content:center;transform:rotate(-8deg);
    box-shadow:inset 0 0 0 3px var(--seal),inset 0 0 0 5px #f6e9e4;animation:sellar .22s ease-out}
  .sello.mal{background:var(--ink2);box-shadow:inset 0 0 0 3px var(--ink2),inset 0 0 0 5px #e8e5dc}
  .sello.nuevo{right:auto;left:-22px;top:-18px;bottom:auto;width:46px;height:46px;font-size:26px;animation:none}
  @keyframes sellar{from{transform:rotate(-8deg) scale(1.6);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}
  @media (prefers-reduced-motion:reduce){.sello{animation:none}}
  .sub{color:var(--muted);text-align:center;margin:-6px 0 0}
  .opciones{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .op{background:var(--sheet);border:1.5px solid var(--ink);padding:16px 8px;font-size:16px;min-height:60px}
  .op.cjk{font-family:var(--kai);font-size:42px;padding:6px;
    background:linear-gradient(to right,transparent 49.6%,#b5312b26 49.6%,#b5312b26 50.4%,transparent 50.4%),
               linear-gradient(to bottom,transparent 49.6%,#b5312b26 49.6%,#b5312b26 50.4%,transparent 50.4%),var(--sheet)}
  .op.sel{background:var(--ink);color:var(--sheet)}
  .op.ok{background:var(--jade);color:#eef5ef;border-color:var(--jade)}
  .op.bad{background:transparent;color:var(--muted);border-style:dashed;text-decoration:line-through}
  .op:focus-visible,.btn:focus-visible,.cuadro:focus-visible{outline:3px solid var(--seal);outline-offset:2px}
  .tonos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .tonos .op{font-size:22px}
  input.py{width:100%;font:inherit;font-size:24px;text-align:center;padding:14px;border:1.5px solid var(--ink);
    background:var(--sheet);color:var(--ink);outline:none;border-radius:0}
  input.py:focus{box-shadow:0 0 0 3px #b5312b55}
  .ayuda{color:var(--muted);font-size:13px;text-align:center;margin-top:8px}
  .linea{min-height:62px;border-bottom:1.5px solid var(--ink);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;margin-bottom:18px}
  .fichas{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .ficha{background:var(--sheet);border:1.5px solid var(--ink);box-shadow:2px 2px 0 var(--ink);padding:6px 12px;font-family:var(--kai);font-size:28px}
  .ficha.hueco{visibility:hidden}
  .intro{text-align:center}
  .intro .py{font-size:26px;color:var(--seal);margin-top:4px} .intro .es{font-size:20px;margin:2px 0 12px}
  .partes{display:flex;justify-content:center;gap:8px;font-family:var(--kai);font-size:30px;margin:6px 0}
  .partes span{border:1.5px solid var(--line);padding:2px 12px;background:var(--sheet)}
  .partes span.r{border-color:var(--seal);color:var(--seal)}
  .nota{color:var(--ink2);font-size:14px;margin:8px 0 0;line-height:1.45}
  .abajo{position:fixed;left:0;right:0;bottom:0;padding:16px 18px;border-top:1.5px solid var(--ink);background:var(--paper)}
  .abajo{transition:background .2s}
  .abajo.ok{background:#dfe8de;border-top-color:var(--jade)} .abajo.bad{background:#dcd6ca}
  .abajo.ok,.abajo.bad{animation:panelSube .34s cubic-bezier(.2,.9,.25,1.15)}
  .abajo.ok .fb,.abajo.bad .fb{animation:fbEntra .3s .06s ease-out both}
  .fb{display:none;align-items:center;gap:12px}
  .fb .mini{flex:none;width:40px;height:40px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-family:var(--kai);
    font-size:24px;font-weight:400;color:#f6e9e4;transform:rotate(-8deg);animation:miniSello .3s .1s ease-out both}
  .abajo.ok .fb .mini{background:var(--jade);box-shadow:inset 0 0 0 2.5px var(--jade),inset 0 0 0 4px #eef5ef}
  .abajo.bad .fb .mini{background:var(--ink2);box-shadow:inset 0 0 0 2.5px var(--ink2),inset 0 0 0 4px #e8e5dc}
  .fb .txt{flex:1;min-width:0}
  @keyframes panelSube{from{transform:translateY(64px)}to{transform:none}}
  @keyframes fbEntra{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes miniSello{from{opacity:0;transform:rotate(-8deg) scale(1.8)}to{opacity:1;transform:rotate(-8deg) scale(1)}}
  .abajo .in{max-width:560px;margin:0 auto}
  .fb{font-weight:700;font-size:18px;margin-bottom:10px;display:none}
  .fb small{display:block;font-weight:400;font-size:15px;margin-top:3px;color:var(--ink2)}
  .abajo.ok .fb{display:flex;color:var(--jade)} .abajo.bad .fb{display:flex;color:var(--ink)}
  .btn{width:100%;padding:15px;font-weight:800;font-size:15px;background:var(--ink);color:var(--sheet);letter-spacing:.14em}
  .btn:disabled{background:var(--line);color:var(--muted)}
  .abajo.ok .btn{background:var(--jade)}
  /* ---------- palabras del libro (varios caracteres en fila) ---------- */
  .seccion{font-family:var(--kai);font-size:22px;margin:28px 0 -10px;color:var(--ink2);border-bottom:1.5px solid var(--line);padding-bottom:4px}
  .seccion small{font-family:system-ui,-apple-system,sans-serif;font-size:13px;color:var(--muted);margin-left:8px}
  .palabra{display:flex;justify-content:center;position:relative;width:max-content;margin:8px auto 18px}
  .palabra .mizi{width:var(--s);height:var(--s);margin:0}
  .palabra .mizi+.mizi{margin-left:-2px}
  .palabra .mizi>span{font-size:calc(var(--s)*.8)}
  .pron .op{font-size:21px}
  .op.pal:not(.sel):not(.ok):not(.bad){background:var(--sheet)}
  .fin{text-align:center;padding-top:34px}
  .fin .gran{width:132px;height:132px;margin:6px auto 18px;border-radius:10px;background:var(--seal);color:#f6e9e4;font-family:var(--kai);font-size:96px;
    line-height:1;display:flex;align-items:center;justify-content:center;transform:rotate(-8deg);
    box-shadow:inset 0 0 0 5px var(--seal),inset 0 0 0 8px #f6e9e4;animation:granSello .6s cubic-bezier(.3,0,.4,1) both}
  .fin .gran.hoy{background:var(--ink);box-shadow:inset 0 0 0 5px var(--ink),inset 0 0 0 8px #f3f1ea}
  .fin.impacto{animation:tiembla .28s .55s ease-out}
  .fin h2,.fin .sub2,.fin .stats,.fin .lista,.fin .msg{animation:fbEntra .4s ease-out both}
  .fin h2{animation-delay:.65s} .fin .sub2{animation-delay:.72s;color:var(--muted)} .fin .stats{animation-delay:.8s} .fin .msg{animation-delay:.9s} .fin .lista{animation-delay:1s}
  .fin .lista{text-align:left;background:var(--sheet);border:1.5px solid var(--ink);padding:12px 14px;margin-top:6px}
  .fin .lista h4{margin:0 0 6px;font-size:14px}
  .fin .lista div{display:flex;gap:10px;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--line);font-size:14px}
  .fin .lista div:last-child{border-bottom:0}
  .fin .lista b{font-family:var(--kai);font-weight:400;font-size:22px;min-width:52px} .fin .lista i{font-style:normal;color:var(--seal)}
  @keyframes granSello{0%{opacity:0;transform:rotate(-24deg) scale(2.6)}70%{opacity:1;transform:rotate(-6deg) scale(.9)}100%{opacity:1;transform:rotate(-8deg) scale(1)}}
  @keyframes tiembla{0%,100%{transform:none}25%{transform:translate(-3px,2px)}50%{transform:translate(3px,-1px)}75%{transform:translate(-1px,1px)}}
  @media (prefers-reduced-motion:reduce){.fin .gran,.fin.impacto,.fin h2,.fin .sub2,.fin .stats,.fin .lista,.fin .msg,.abajo.ok,.abajo.bad,.fb,.fb .mini{animation:none!important}}
  .fin .stats{display:flex;gap:10px;justify-content:center;margin:20px 0}
  .fin .stats div{background:var(--sheet);border:1.5px solid var(--ink);padding:10px 14px;min-width:92px;font-size:13px;color:var(--ink2)}
  .fin .stats b{display:block;font-size:24px;color:var(--ink)}
  /* ---------- apartados (barra de abajo) ---------- */
  #camino{padding-bottom:84px}
  .vista{display:none} .vista.on{display:block}
  nav#tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--paper);border-top:1.5px solid var(--ink);z-index:5;
    padding-bottom:env(safe-area-inset-bottom)}
  nav#tabs button{flex:1;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;color:var(--muted)}
  nav#tabs button b{font-family:var(--kai);font-weight:400;font-size:25px;line-height:1.1}
  nav#tabs button.on{color:var(--seal)} nav#tabs button.on b{color:var(--seal)}
  /* Hoy */
  .hoy{margin:18px 0 6px;background:var(--ink);color:var(--sheet);padding:18px;position:relative}
  .hoy h3{margin:0;font-size:20px} .hoy p{margin:4px 0 14px;color:#cfc9bb;font-size:14px;max-width:80%}
  .hoy .meta{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .hoy .meta span{background:#ffffff14;padding:6px 10px;font-size:13px}
  .hoy .go{display:block;width:100%;background:var(--seal);color:#fff;font-weight:800;letter-spacing:.12em;padding:14px}
  .hoy .go:disabled{background:#ffffff22;color:#cfc9bb}
  .hoy .sellohoy{position:absolute;right:16px;top:16px;width:46px;height:46px;border-radius:6px;background:var(--seal);color:#f6e9e4;font-family:var(--kai);
    font-size:27px;display:flex;align-items:center;justify-content:center;transform:rotate(-6deg);box-shadow:inset 0 0 0 3px var(--seal),inset 0 0 0 5px #f6e9e4}
  .caja{background:var(--sheet);border:1.5px solid var(--ink);padding:14px;margin-top:14px}
  .caja h4{margin:0 0 8px;font-size:15px}
  .debiles{display:flex;flex-wrap:wrap;gap:8px}
  .debiles span{font-family:var(--kai);font-size:24px;border:1.5px solid var(--line);padding:2px 10px;background:var(--paper)}
  .debiles span.larga{font-size:17px}
  .debiles small{font-family:system-ui;font-size:11px;color:var(--muted);margin-left:5px}
  .numeros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
  .numeros b{display:block;font-size:24px} .numeros div{font-size:12px;color:var(--muted)}
  /* Libro */
  .voc-btn{margin-top:12px;font-size:13px;color:var(--ink2);text-decoration:underline}
  table.voc{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
  table.voc td{border-bottom:1px solid var(--line);padding:7px 4px;vertical-align:middle}
  table.voc .h{font-family:var(--kai);font-size:22px;white-space:nowrap} table.voc .p{color:var(--seal)}
  table.voc .m{color:var(--jade);font-weight:700;text-align:right;white-space:nowrap;letter-spacing:-1px}
  /* tonos en el celular */
  .tecla-tonos{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
  .tecla-tonos button{font-size:24px;padding:9px 0 7px;background:var(--sheet);border:1.5px solid var(--ink);box-shadow:2px 2px 0 var(--ink);line-height:1}
  .tecla-tonos button small{display:block;font-size:11px;color:var(--muted);margin-top:3px}
  .tecla-tonos button:active{transform:translate(2px,2px);box-shadow:none}
  .oir{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:700;color:var(--seal);padding:7px 15px 7px 12px;margin-top:8px;
    background:var(--sheet);border-radius:5px;transform:rotate(-1.5deg);transition:transform .12s;
    box-shadow:inset 0 0 0 1.5px var(--seal),inset 0 0 0 3.5px var(--sheet),inset 0 0 0 4.5px var(--seal)}
  .oir:active{transform:rotate(-1.5deg) scale(.94)}
  .burb .oir{font-size:12px;padding:5px 11px 5px 9px;margin-top:6px}
  /* diálogos */
  .chat{display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
  .burb{max-width:84%;padding:9px 12px;border:1.5px solid var(--ink);background:var(--sheet)}
  .burb .h{font-family:var(--kai);font-size:22px;line-height:1.3} .burb .p{font-size:12px;color:var(--muted)} .burb .e{font-size:13px;color:var(--ink2)}
  .burb.b{align-self:flex-end;background:#fff} .burb.hueco{border-style:dashed;background:transparent;color:var(--muted);min-width:90px}
  .quien{font-size:11px;font-weight:700;color:var(--seal);letter-spacing:.08em;margin-bottom:2px}
  .op.frase{font-family:var(--kai);font-size:22px;text-align:left;grid-column:1/-1}
  /* Planas */
  .grupo h4{margin:20px 0 8px;font-size:15px} .grupo h4 small{color:var(--muted);font-weight:400}
  .rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px}
  .rejilla button{aspect-ratio:1;font-family:var(--kai);font-size:30px;background:var(--sheet);border:1.5px solid var(--line);position:relative}
  .rejilla button.hecha{border-color:var(--seal);color:var(--seal)}
  .rejilla button.hecha::after{content:"完";position:absolute;right:-4px;top:-6px;font-size:12px;background:var(--seal);color:#fff;padding:1px 3px;transform:rotate(-8deg)}
  #plana{display:none;min-height:100vh;padding-bottom:30px}
  .pasos{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin:10px 0 4px}
  .pasos svg{width:46px;height:46px;border:1px solid #b5312b66;background:
      linear-gradient(to right,transparent 49%,#b5312b22 49%,#b5312b22 51%,transparent 51%),
      linear-gradient(to bottom,transparent 49%,#b5312b22 49%,#b5312b22 51%,transparent 51%),var(--sheet)}

"一","个","女孩儿"],["学生","岁"]],["你多大","¿Cuántos años tienes?",["你","多大"],["想","女孩儿"]],["我女儿两岁","Mi hija tiene dos años",["我","女","儿","两","岁"],["多少","大概"]],["孩子很可爱","El niño es muy tierno",["孩子","很","可爱"],["多少","大概"]],["我们走吧","Vámonos",["我们","走","吧"],["多大","岁"]]],"pal":["女孩儿","多大","两","岁","可爱","吧","学校","多少","学生","想","大概","万","没有"]},{"libro":true,"leccion":3,"num":"第三课","t":"Lección 3C · 你家有几口人","d":"La familia, la edad, cantidades y números grandes · parte 3 de 3","muestra":"多 千","frases":[["学生很多","Hay muchos estudiantes",["学生","很","多"],["因为","少"]],["老板让我去那儿工作","El jefe quiere que vaya a trabajar allí",["老板","让","我","去","那儿","工作"],["为","分公司"]],["你为什么不去","¿Por qué no vas?",["你","为什么","不","去"],["少","老板"]],["浙江分公司","la sucursal de Zhejiang",["浙江","分公司"],["去","让"]],["让我去","déjame ir / me manda ir",["让","我","去"],["分公司","百"]]],"dialogos":[{"t":"Texto 1 · Paisanos (p. 29)","lineas":[["Bai Xiaohong","你是什么地方人？","Nǐ shì shénme dìfang rén?","¿De qué lugar eres?"],["Ding Hansheng","我是浙江人，你呢？","Wǒ shì Zhèjiāngrén. Nǐ ne?","Soy de Zhejiang. ¿Y tú?",["我想，大概有三万个。","一个人。你呢？"]],["Bai Xiaohong","我也是浙江人。","Wǒ yě shì Zhèjiāngrén.","Yo también soy de Zhejiang.",["一个人。你呢？","我一家人都在这儿。"]],["Ding Hansheng","你一个人在这儿？","Nǐ yí ge rén zài zhèr?","¿Estás aquí sola?",["我一家人都在这儿。","我们在中国有一个分公司，老板让我去那儿工作。"]],["Bai Xiaohong","一个人。你呢？","Yí ge rén. Nǐ ne?","Sola. ¿Y tú?",["有没有人学习汉语？","我想，大概有三万个。"]],["Ding Hansheng","我一家人都在这儿。","Wǒ yì jiā rén dōu zài zhèr.","Toda mi familia está aquí.",["很可爱吧？","我也是浙江人。"]],["Bai Xiaohong","你家有几口人？","Nǐ jiā yǒu jǐ kǒu rén?","¿Cuántas personas hay en tu familia?",["有很多人学习汉语。","很可爱吧？"]],["Ding Hansheng","五口。我爸爸、妈妈、我和我太太、一个女儿。","Wǔ kǒu. Wǒ bàba, māma, wǒ hé wǒ tàitai, yí ge nǚ'ér.","Cinco. Mi papá, mi mamá, yo y mi esposa, y una hija.",["你是什么地方人？","很可爱吧？"]],["Bai Xiaohong","孩子多大？","Háizi duō dà?","¿Cuántos años tiene la niña?",["你是什么地方人？","大概有多少人？"]],["Ding Hansheng","两岁。","Liǎng suì.","Dos años."],["Bai Xiaohong","很可爱吧？","Hěn kě'ài ba?","Es muy tierno, ¿verdad?",["你家有几口人？","我们在中国有一个分公司，老板让我去那儿工作。"]],["Ding Hansheng","是啊，很可爱。","Shì a, hěn kě'ài.","Sí, muy tierno.",["你是什么地方人？","大概有一千个。"]]]},{"t":"Texto 2 · En la universidad (pp. 30-31)","lineas":[["安东尼奥","你们学校有多少学生？","Nǐmen xuéxiào yǒu duōshao xuésheng?","¿Cuántos estudiantes hay en su escuela?"],["Zhang Lin","我想，大概有三万个。","Wǒ xiǎng, dàgài yǒu sān wàn ge.","Creo que hay unos treinta mil.",["你一个人在这儿？","五口。我爸爸、妈妈、我和我太太、一个女儿。"]],["安东尼奥","有没有人学习汉语？","Yǒu méiyǒu rén xuéxí Hànyǔ?","¿Hay alguien que estudie chino?",["你们学校有多少学生？","我是浙江人，你呢？"]],["Zhang Lin","有很多人学习汉语。","Yǒu hěn duō rén xuéxí Hànyǔ.","Hay mucha gente que estudia chino.",["你是什么地方人？","五口。我爸爸、妈妈、我和我太太、一个女儿。"]],["安东尼奥","大概有多少人？","Dàgài yǒu duōshao rén?","¿Cuántas personas, más o menos?",["你们学校有多少学生？","一个人。你呢？"]],["Zhang Lin","大概有一千个。","Dàgài yǒu yì qiān ge.","Unos mil.",["有很多人学习汉语。","我想，大概有三万个。"]],["安东尼奥","我想去你们学校学习汉语。","Wǒ xiǎng qù nǐmen xuéxiào xuéxí Hànyǔ.","Quiero ir a su escuela a estudiar chino.",["你是什么地方人？","孩子多大？"]],["Zhang Lin","是吗？你为什么想学习汉语？","Shì ma? Nǐ wèi shénme xiǎng xuéxí Hànyǔ?","¿Ah, sí? ¿Por qué quieres estudiar chino?",["你一个人在这儿？","你家有几口人？"]],["安东尼奥","我们在中国有一个分公司，老板让我去那儿工作。","Wǒmen zài Zhōngguó yǒu yí ge fēn gōngsī, lǎobǎn ràng wǒ qù nàr gōngzuò.","Tenemos una sucursal en China y el jefe quiere que vaya a trabajar allí.",["你一个人在这儿？","有很多人学习汉语。"]]]}],"pal":["多","千","去","为什么","为","分公司","老板","让","那儿","百","少","因为","浙江"]},{"libro":true,"leccion":4,"num":"第四课","t":"Lección 4A · 这张地图是西班牙文的","d":"Mapas, idiomas, diccionarios y pedir permiso · parte 1 de 3","muestra":"地图 张","frases":[["这张地图是西班牙文的","Este mapa está en español",["这","张","地图","是","西班牙文","的"],["知道","玩儿"]],["一张地图","un mapa",["一","张","地图"],["比较","玩儿"]],["这张报是中文的","Este periódico está en chino",["这","张","报","是","中文","的"],["一下","真"]],["我看一下","Déjame echar un vistazo",["我","看","一下"],["张","中文"]],["我要这本书","Quiero este libro",["我","要","这","本","书"],["地图","西班牙文"]]],"pal":["地图","张","中文","西班牙文","看","一下","行","要","干","是的","玩儿","知道","比较","真"]},{"libro":true,"leccion":4,"num":"第四课","t":"Lección 4B · 这张地图是西班牙文的","d":"Mapas, idiomas, diccionarios y pedir permiso · parte 2 de 3","muestra":"有意思 意思","frases":[["这本书很有意思","Este libro es muy interesante",["这","本","书","很","有意思"],["问","谁"]],["这是什么意思","¿Qué significa esto?",["这","是","什么","意思"],["词典","山"]],["中国龙","el dragón chino",["中国","龙"],["有用","有意思"]],["这本词典非常好","Este diccionario es muy bueno",["这","本","词典","非常","好"],["问","有意思"]],["一本词典","un diccionario",["一","本","词典"],["谁","有用"]]],"pal":["有意思","意思","龙","山","词典","汉西词典","西汉词典","本","谁","请问","问","对","非常","有用"]},{"libro":true,"leccion":4,"num":"第四课","t":"Lección 4C · 这张地图是西班牙文的","d":"Mapas, idiomas, diccionarios y pedir permiso · parte 3 de 3","muestra":"能 用","frases":[["我能看吗","¿Puedo verlo?",["我","能","看","吗"],["上海","当然"]],["我用这本词典","Uso este diccionario",["我","用","这","本","词典"],["龙山","教室"]],["当然可以","Claro que se puede",["当然","可以"],["笔","教室"]],["一本书","un libro",["一","本","书"],["龙山","北京"]],["一个本子","una libreta",["一","个","本子"],["上海","笔"]]],"dialogos":[{"t":"Texto 1 · El mapa de China (pp. 38-39)","lineas":[["Juan","你有没有中国地图？","Nǐ yǒu méiyǒu Zhōngguó dìtú?","¿Tienes un mapa de China?"],["Bai Xiaohong","有。我有两张中国地图。一张中文的，一张西班牙文的。","Yǒu. Wǒ yǒu liǎng zhāng Zhōngguó dìtú. Yì zhāng Zhōngwén de, yì zhāng Xībānyáwén de.","Sí. Tengo dos mapas de China. Uno en chino y uno en español.",["龙山？不知道。龙山大不大？","我知道。"]],["Juan","我看一下，行吗？","Wǒ kàn yíxià, xíng ma?","¿Puedo echar un vistazo?",["这是什么词典？","这本词典怎么样？"]],["Bai Xiaohong","行。你要中文的还是西班牙文的？","Xíng. Nǐ yào Zhōngwén de háishi Xībānyáwén de?","Claro. ¿Lo quieres en chino o en español?",["这本词典怎么样？","你有没有中国地图？"]],["Juan","西班牙文的。","Xībānyáwén de.","En español.",["汉西词典。","这是龙山。"]],["Bai Xiaohong","给。这张地图是西班牙文的。","Gěi. Zhè zhāng dìtú shì Xībānyáwén de.","Toma. Este mapa está en español.",["老师，请问，这本词典是您的吗？","当然可以。"]],["Juan","谢谢！","Xièxie!","¡Gracias!"],["Bai Xiaohong","你看中国地图干什么？你想去中国？","Nǐ kàn Zhōngguó dìtú gàn shénme? Nǐ xiǎng qù Zhōngguó?","¿Para qué miras el mapa de China? ¿Quieres ir a China?",["是谁的？","那儿没有龙，只有山。"]],["Juan","是的，我想去中国玩儿。","Shìde, wǒ xiǎng qù Zhōngguó wánr.","Sí, quiero ir a China de viaje.",["这个名字真有意思！那儿有龙吗？","行。你要中文的还是西班牙文的？"]],["Bai Xiaohong","那好啊！（abriendo el mapa）你看，这是北京。","Nà hǎo a! (abriendo el mapa) Nǐ kàn, zhè shì Běijīng.","¡Qué bien! (abriendo el mapa) Mira, esto es Beijing.",["这是龙山。","那儿没有龙，只有山。"]],["Juan","我知道。","Wǒ zhīdào.","Lo sé.",["这是龙山。","你有没有中国地图？"]],["Bai Xiaohong","这是上海。","Zhè shì Shànghǎi.","Esto es Shanghái.",["那本呢？","你有没有中国地图？"]],["Juan","我知道。","Wǒ zhīdào.","Lo sé.",["这是龙山。","你有没有中国地图？"]],["Bai Xiaohong","这是龙山。","Zhè shì Lóngshān.","Esto es Longshan.",["这本汉西词典是我的，那本西汉词典不是我的。","行。你要中文的还是西班牙文的？"]],["Juan","龙山？不知道。龙山大不大？","Lóngshān? Bù zhīdào. Lóngshān dà bu dà?","¿Longshan? No lo conozco. ¿Longshan es grande?",["有。我有两张中国地图。一张中文的，一张西班牙文的。","那本呢？"]],["Bai Xiaohong","比较小。我家在那儿。","Bǐjiào xiǎo. Wǒ jiā zài nàr.","Más bien pequeño. Mi familia vive allí.",["这本词典怎么样？","当然可以。"]],["Juan","这个名字真有意思！那儿有龙吗？","Zhè ge míngzi zhēn yǒu yìsi! Nàr yǒu lóng ma?","¡Este nombre es muy interesante! ¿Hay dragones allí?",["当然可以。","龙山？不知道。龙山大不大？"]],["Bai Xiaohong","那儿没有龙，只有山。","Nàr méiyǒu lóng, zhǐ yǒu shān.","Allí no hay dragones, solo montaña.",["西汉词典。","这本汉西词典是我的，那本西汉词典不是我的。"]]]},{"t":"Texto 2 · Los diccionarios (pp. 40-41)","lineas":[["César","这是什么词典？","Zhè shì shénme cídiǎn?","¿Qué diccionario es este?"],["Juan","汉西词典。","Hàn-Xī cídiǎn.","Un diccionario chino-español.",["我能不能用一下？","西汉词典。"]],["César","那本呢？","Nà běn ne?","¿Y ese otro?",["这两本词典都是你的吗？","这本汉西词典是我的，那本西汉词典不是我的。"]],["Juan","西汉词典。","Xī-Hàn cídiǎn.","Un diccionario español-chino.",["我看一下，行吗？","是谁的？"]],["César","这两本词典都是你的吗？","Zhè liǎng běn cídiǎn dōu shì nǐ de ma?","¿Los dos diccionarios son tuyos?",["对，是我的。","有。我有两张中国地图。一张中文的，一张西班牙文的。"]],["Juan","这本汉西词典是我的，那本西汉词典不是我的。","Zhè běn Hàn-Xī cídiǎn shì wǒ de, nà běn Xī-Hàn cídiǎn bú shì wǒ de.","Este chino-español es mío; ese español-chino no es mío.",["行。你要中文的还是西班牙文的？","这是上海。"]],["César","是谁的？","Shì shuí de?","¿De quién es?",["是的，我想去中国玩儿。","西班牙文的。"]],["Juan","不知道。我想，这大概是老师的词典。","Bù zhīdào. Wǒ xiǎng, zhè dàgài shì lǎoshī de cídiǎn.","No lo sé. Creo que es el diccionario del profesor.",["这两本词典都是你的吗？","那本呢？"]],["César","老师，请问，这本词典是您的吗？","Lǎoshī, qǐngwèn, zhè běn cídiǎn shì nín de ma?","Profesor, disculpe, ¿este diccionario es suyo?",["那儿没有龙，只有山。","这本汉西词典是我的，那本西汉词典不是我的。"]],["profesor Zhang","对，是我的。","Duì, shì wǒ de.","Sí, es mío.",["那儿没有龙，只有山。","你有没有中国地图？"]],["César","这本词典怎么样？","Zhè běn cídiǎn zěnmeyàng?","¿Qué tal es este diccionario?",["是谁的？","你有没有中国地图？"]],["profesor Zhang","这本词典非常好，非常有用。","Zhè běn cídiǎn fēicháng hǎo, fēicháng yǒuyòng.","Este diccionario es muy bueno y muy útil.",["我看一下，行吗？","我知道。"]],["César","我能不能用一下？","Wǒ néng bu néng yòng yíxià?","¿Puedo usarlo un momento?",["西汉词典。","你看中国地图干什么？你想去中国？"]],["profesor Zhang","当然可以。","Dāngrán kěyǐ.","Claro que sí.",["这个名字真有意思！那儿有龙吗？","那本呢？"]]]}],"pal":["能","用","当然","书","本子","笔","支","教室","上课","北京","上海","龙山"]}];

' es átono. 认识你很高兴 = encantado de conocerte."],"很":["hěn","hen3","muy","Adv.","Va antes del adjetivo. A veces no significa 'muy' sino que solo une sujeto y adjetivo: 我很高兴 = estoy contento."],"高兴":["gāoxìng","gao1 xing4","encantado, alegre, contento","Adj.",""],"在":["zài","zai4","(estar) en; en","Prep. y V.","Como preposición va antes del verbo: 我在公司工作 = trabajo en una compañía. Como verbo: 我在家 = estoy en casa."],"进出口":["jìnchūkǒu","jin4 chu1 kou3","importar y exportar; importación y exportación","","Compuesto de 进 (entrar) + 出 (salir) + 口 (boca/puerta). El libro lo lista con sus dos piezas debajo."],"进口":["jìnkǒu","jin4 kou3","importar","V.","Literal: 'entrar por la puerta'."],"出口":["chūkǒu","chu1 kou3","exportar; salida","V.","Literal: 'salir por la puerta'. También es el letrero de SALIDA."],"公司":["gōngsī","gong1 si1","compañía, empresa","Sust.","El 'si' es átono."],"工作":["gōngzuò","gong1 zuo4","trabajar; empleo, trabajo","V. y Sust.","Como sustantivo: 我的工作 = mi trabajo."],"大学":["dàxué","da4 xue2","universidad","Sust.","大 (grande) + 学 (estudiar)."],"系":["xì","xi4","departamento (de una universidad), facultad","Sust.","东亚学系 = Departamento de Estudios de Asia Oriental."],"学习":["xuéxí","xue2 xi2","estudiar, aprender","V.","Más formal que 学 solo; se usa para materias y idiomas."],"可以":["kěyǐ","ke3 yi3","poder (tener permiso); se puede","V.O.","Pedir o dar permiso. En pregunta: 可以给你打电话吗？ = ¿te puedo llamar? Se dice suave: ké yǐ."],"给":["gěi","gei3","dar; a, para (alguien)","Prep.","Estructura: 给 + persona + verbo = hacer algo a/para alguien. 给你打电话 = llamarte."],"打电话":["dǎdiànhuà","da3 dian4 hua4","hacer una llamada telefónica","","Literal 'golpear el teléfono'. 打 solo = golpear, jugar."],"电话":["diànhuà","dian4 hua4","teléfono","Sust.","电 (electricidad) + 话 (habla)."],"的":["de","de5","partícula posesiva (de)","Part.","A + 的 + B = el B de A. Tono neutro."],"我的":["wǒde","wo3 de5","mi, mío","","我 + 的."],"我们的":["wǒmende","wo3 men5 de5","nuestro","","我们 + 的."],"号码":["hàomǎ", const fecha=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

const masDias=n=>fecha(new Date(Date.now()+n*864e5));
// ---------- repetición espaciada ----------
// Cada clave cambia su intervalo una sola vez por sesión: el primer acierto lo alarga, cualquier fallo lo reinicia.
function srsResponde(clave, ok){
  if(!clave) return;
  const r = S.srs[clave] || (S.srs[clave]={iv:0,due:hoy(),n:0,f:0});
  if(!ok){ r.iv=0; r.due=hoy(); r.f++; L.srsTocado.add(clave); return; }
  r.n++;
  if(L.srsTocado.has(clave)){ if(r.iv===0) r.due=masDias(1); return; }
  L.srsTocado.add(clave);
  r.iv = r.iv<1 ? 1 : Math.min(180, Math.round(r.iv*2.3));
  r.due = masDias(r.iv);
}
const claveSRS=e=> e.w ? 'p:'+e.w : e.hz ? 'h:'+e.hz : (e.tipo==='par' ? 'h:'+e.p.h : null);

// ---------- banco de errores ----------
// Todo lo que falles, sea del nivel que sea, entra aquí y te va saliendo en 今 Hoy.
// Sale del banco tras SALIR_BANCO aciertos seguidos, cada uno en un día distinto (el día que lo fallas no cuenta).
// Un fallo reinicia la cuenta.
const SALIR_BANCO=3, MAX_BANCO_HOY=5;
const claveError=e=> e.w ? 'p:'+e.w : e.hz ? 'h:'+e.hz : e.tipo==='par' ? 'r:'+e.p.h
  : e.tipo==='frase' ? 'f:'+e.f[0] : e.tipo==='dialogo' ? 'd:'+e.d.lineas[e.i][1] : null;
function bancoResponde(e, ok){
  const k=claveError(e); if(!k) return;
  const r=S.errores[k];
  if(!ok){ const x=r||(S.errores[k]={f:0,ok:0,dia:null,fallo:null}); x.f++; x.ok=0; x.dia=null; x.fallo=hoy(); return; }
  if(!r || r.fallo===hoy() || r.dia===hoy()) return;
  r.ok++; r.dia=hoy();
  if(r.ok>=SALIR_BANCO){ delete S.errores[k]; L.graduados.push(k); }
}
// Arma un ejercicio a partir de una clave (del repaso o del banco). null si ya no existe en los datos.
function ejercicioDe(k){
  const t=k[0], x=k.slice(2), una=a=>a[Math.floor(Math.random()*a.length)], iv=(S.srs[k]||{}).iv||0;
  if(t==='p'){ if(!P[x]) return null;
    return {tipo:una(palConTono(x) ? (iv>=3 ? ['pal-elige','pal-escribe','pal-tono','pal-escribe'] : ['pal-sig','pal-elige','pal-tono']) : ['pal-sig','pal-elige']), w:x, pool:Object.keys(P)}; }
  if(t==='h'){ if(!C[x]) return null;
    return {tipo:una(conTono(x) ? (iv>=3 ? ['hanzi','escribe','tono'] : ['significado','hanzi','tono']) : ['significado','hanzi']), hz:x, pool:Object.keys(C)}; }
  if(t==='r'){ const p=UNIDADES.flatMap(u=>u.pares||[]).find(p=>p.h===x); return p ? {tipo:'par',p} : null; }
  if(t==='f'){ const f=UNIDADES.flatMap(u=>u.frases||[]).find(f=>f[0]===x); return f ? {tipo:'frase',f} : null; }
  if(t==='d'){ for(const u of UNIDADES) for(const d of u.dialogos||[]){ const i=d.lineas.findIndex(l=>l[1]===x && l[4]); if(i>=0) return {tipo:'dialogo',d,i}; } }
  return null;
}
// Sorteo con peso: lo que más has fallado sale más seguido. No repite lo que ya contó hoy.
function erroresParaHoy(excluir){
  const cand=Object.entries(S.errores).filter(([k,r])=>!excluir.has(k) && r.fallo!==hoy() && r.dia!==hoy()), out=[];
  while(cand.length && out.length<MAX_BANCO_HOY){
    let z=Math.random()*cand.reduce((s,[,r])=>s+r.f,0), i=0;
    while(i<cand.length-1 && (z-=cand[i][1].f)>0) i++;
    const [k]=cand.splice(i,1)[0], e=ejercicioDe(k);
    if(e){ e.banco=true; out.push(e); }
  }
  return out;
}

function audio(){ try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); }catch(e){ AC=null; } return AC; }
function cargaSonidos(){
  if(cargandoSon) return cargandoSon;
  return cargandoSon=fetch('sonidos.json').then(r=>r.json()).then(j=>Promise.all(Object.entries(j).map(([k,b64])=>{
    const bin=atob(b64), u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
    return new Promise(ok=>audio().decodeAudioData(u.buffer,b=>{ BUF[k]=b;
      const d=b.getChannelData(0); let i=0; while(i<d.length && Math.abs(d[i])<.02) i++; INI[k]=i<d.length ? i/b.sampleRate : 0; ok(); },()=>ok()));
  }))).catch(()=>{ cargandoSon=null; });
}
function efecto(nombre, retraso){
  if(!S.sonido) return;
  const c=audio(); if(!c) return;
  if(!Object.keys(BUF).length){ cargaSonidos(); return; }
  const t0=c.currentTime+(retraso||0);
  for(const [n,t,r,v] of EFECTOS[nombre]){ if(!BUF[n]) continue;
    const s=c.createBufferSource(), g=c.createGain(); s.buffer=BUF[n]; s.playbackRate.value=r; g.gain.value=v; s.connect(g).connect(c.destination); s.start(t0+t, INI[n]||0); }
}

const mezcla=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const toma=(a,n)=>mezcla(a).slice(0,n);
const aprendidosHasta=ui=>UNIDADES.slice(0,ui+1).flatMap(u=>u.hz);
const conTono=hz=>C[hz].pn.slice(-1)!=='5';

const palabrasHasta=ui=>UNIDADES.slice(0,ui+1).flatMap(u=>u.pal||[]);
const silabas=pal=>P[pal].pn.split(' ');
const palConTono=pal=>silabas(pal).some(s=>s.slice(-1)!=='5');

function armaLeccionLibro(ui,l){
  const u=UNIDADES[ui], mitad=Math.ceil(u.pal.length/2), pool=palabrasHasta(ui);
  if(l<2){
    const nuevos = l===0 ? u.pal.slice(0,mitad) : u.pal.slice(mitad);
    const primero = nuevos.flatMap(w=>[{tipo:'pal-intro',w},{tipo:'pal-sig',w,pool}]);
    const resto = mezcla([ ...nuevos.map(w=>({tipo:'pal-elige',w,pool})),
                           ...(l===1 ? toma(nuevos.filter(palConTono),3).map(w=>({tipo:'pal-tono',w})) : []) ]);
    return [...primero, ...resto];
  }
  return mezcla([ ...toma(u.pal,3).map(w=>({tipo:'pal-elige',w,pool})),
                  ...toma(u.pal,2).map(w=>({tipo:'pal-sig',w,pool})),
                  ...toma(u.pal.filter(palConTono),2).map(w=>({tipo:'pal-tono',w})),
                  ...toma(u.pal.filter(palConTono),3).map(w=>({tipo:'pal-escribe',w})),
                  ...toma(u.frases,2).map(f=>({tipo:'frase',f})),
                  ...toma(lineasDialogo(u),2) ]);
}
// Ejercicio "¿qué contesta?": una línea con trampas de un diálogo de la unidad.
const lineasDialogo=u=>(u.dialogos||[]).flatMap((d,di)=>d.lineas.map((x,i)=>x[4]?{tipo:'dialogo',d,i}:null).filter(Boolean));

function armaLeccion(ui,l){
  if(UNIDADES[ui].libro) return armaLeccionLibro(ui,l);
  const u=UNIDADES[ui], mitad=Math.ceil(u.hz.length/2), pool=aprendidosHasta(ui);
  if(l<2){
    const nuevos = l===0 ? u.hz.slice(0,mitad) : u.hz.slice(mitad);
    const primero = nuevos.flatMap(hz=>[{tipo:'intro',hz},{tipo:'significado',hz,pool}]);
    const resto = mezcla([ ...nuevos.map(hz=>({tipo:'hanzi',hz,pool})),
                           ...(l===1 ? toma(nuevos.filter(conTono),3).map(hz=>({tipo:'tono',hz})) : []) ]);
    return [...primero, ...resto];
  }
  return mezcla([ ...toma(u.hz,3).map(hz=>({tipo:'hanzi',hz,pool})),
                  ...toma(u.hz.filter(conTono),2).map(hz=>({tipo:'tono',hz})),
                  ...toma(u.hz.filter(conTono),3).map(hz=>({tipo:'escribe',hz})),
                  ...toma(u.pares,3).map(p=>({tipo:'par',p})),
                  ...toma(u.frases,2).map(f=>({tipo:'frase',f})) ]);
}

const campoPinyin=ph=>`<input class="py" id="pyin" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${ph}">
  <div class="tecla-tonos">${[1,2,3,4].map(t=>`<button data-t="${t}">${'āáǎà'[t-1]}<small>${t}</small></button>`).join('')}<button data-t="0">⌫<small>borrar</small></button></div>
  <p class="ayuda">Escribe una sílaba y toca su tono. El neutro no lleva tono. También vale <b>hao3</b>.</p>`;
const MARCADAS='āáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ';
function ponTono(v,t){
  if(!t) return v.slice(0,-1);
  const m=v.match(/[a-zü]+$/i);
  if(m && /[aeiouüv]/i.test(m[0])) return v.slice(0,m.index)+conMarca(m[0].toLowerCase().replace(/ü/g,'v'),t);
  // la última sílaba ya tiene tono: cambiarlo
  for(let k=v.length-1;k>=0;k--){ const i=MARCADAS.indexOf(v[k]); if(i>=0){ const vocal='aeiouv'[Math.floor(i/4)];
    return v.slice(0,k)+MARCAS[vocal][t-1].replace('v','ü')+v.slice(k+1); } if(!/[a-z]/i.test(v[k])) break; }
  return v;
}
function activaPinyin(){

  document.querySelectorAll('.tecla-tonos button').forEach(b=>{
    const aplica=()=>{ if(inp.disabled) return; inp.value=ponTono(inp.value,+b.dataset.t); listo(); };

    b.addEventListener('touchstart',ev=>{ ev.preventDefault(); toque=true; aplica(); },{passive:false});

}

// Compara pinyin de palabras: acepta 'tóngxué', 'tong2xue2', 'tong2 xue2'; el tono neutro con o sin 5.
const canon=s=>s.toLowerCase().normalize('NFC').replace(/[\s'’·\-]/g,'').replace(/u:/g,'ü').replace(/v/g,'ü');
const sinTonos=s=>canon(s).normalize('NFD').replace(/[\u0300\u0301\u0304\u030C]/g,'').normalize('NFC').replace(/[0-5]/g,'');
function pinyinPalabraOk(pal,x){
  const p=P[pal], r=canon(x);
  return [p.py, p.pn, p.pn.replace(/5/g,'')].map(canon).includes(r);
}

// ---------- pinyin ----------
const MARCAS={a:'āáǎà',e:'ēéěè',i:'īíǐì',o:'ōóǒò',u:'ūúǔù',v:'ǖǘǚǜ'};
function conMarca(base,t){
  const s=base;
  let idx;
  if(s.includes('a')) idx=s.indexOf('a');
  else if(s.includes('e')) idx=s.indexOf('e');
  else if(s.includes('ou')) idx=s.indexOf('o');
  else { idx=-1; for(let k=s.length-1;k>=0;k--) if('iouv'.includes(s[k])){ idx=k; break; } }
  if(idx<0) return s;
  return (s.slice(0,idx)+MARCAS[s[idx]][t-1]+s.slice(idx+1)).replace('v','ü');
}
function normaliza(x){
  let s=x.toLowerCase().replace(/\s+/g,'').replace(/ü|u:/g,'v'), tono='';
  for(const [v,m] of Object.entries(MARCAS)) for(let k=0;k<4;k++) if(s.includes(m[k])){ s=s.replace(m[k],v); tono=String(k+1); }
  if(/[0-5]$/.test(s)){ tono=s.slice(-1); s=s.slice(0,-1); }
  if(tono==='0') tono='5';
  return {base:s, tono};
}

$('accion').onclick=()=>{
  const e=L.actual;
  if(L.estado==='fin'){ volver(); return; }
  if(L.estado==='respondido'){ siguiente(); return; }
  if(e.tipo==='intro'){ L.hechos++; siguiente(); return; }
  if(e.tipo==='pal-intro'){ L.hechos++; siguiente(); return; }
  let ok=false, sol='', extra='';
  if(e.tipo==='dialogo'){
    ok = L.sel===e.correcta; const x=e.d.lineas[e.i];
    document.querySelectorAll('.op').forEach((b,i)=>{ if(i===e.correcta) b.classList.add('ok'); else if(i===L.sel) b.classList.add('bad'); });
    sol=x[1]; extra=`${x[2]} · ${x[3]}`; if(S.sonido) habla(x[1]);
  }else if(['pal-sig','pal-elige','pal-tono'].includes(e.tipo)){
    ok = L.sel===e.correcta;
    document.querySelectorAll('.op').forEach((b,i)=>{ if(i===e.correcta) b.classList.add('ok'); else if(i===L.sel) b.classList.add('bad'); });
    const p=P[e.w];
    sol = e.tipo==='pal-sig'? p.es : e.tipo==='pal-elige'? p.p : p.py;
    extra = `<span class="cjk">${p.p}</span> ${p.py} · ${p.es}`;
  }else if(e.tipo==='pal-escribe'){
    const p=P[e.w], x=$('pyin').value;
    ok = pinyinPalabraOk(e.w,x);
    sol=p.py; extra = (!ok && sinTonos(x)===sinTonos(p.py)) ? 'Casi: el sonido está bien, pero algún tono no.' : p.es;
    $('pyin').disabled=true;
  }else if(['significado','hanzi','tono','par'].includes(e.tipo)){
    ok = L.sel===e.correcta;
    document.querySelectorAll('.op').forEach((b,i)=>{ if(i===e.correcta) b.classList.add('ok'); else if(i===L.sel) b.classList.add('bad'); });
    const c=C[e.tipo==='par'? e.p.h : e.hz];
    sol = e.tipo==='par' ? e.p.a : (e.tipo==='significado'? c.es : e.tipo==='hanzi'? c.h : c.py);
    extra = e.tipo==='par' ? e.p.por : `<span class="cjk">${c.h}</span> ${c.py} · ${c.es}`;
  }else if(e.tipo==='escribe'){
    const c=C[e.hz], r=normaliza($('pyin').value), want=normaliza(c.pn);
    ok = r.base===want.base && r.tono===want.tono;
    sol=c.py; extra = (!ok && r.base===want.base) ? 'Casi: el sonido está bien, pero el tono no.' : c.es;
    $('pyin').disabled=true;
  }else if(e.tipo==='frase'){
    const [,es,piezas]=e.f;
    ok = e.orden.map(i=>e.fichas[i].t).join('|')===piezas.join('|'); sol=piezas.join(' '); extra=es;
  }
  L.estado='respondido';
  const clave = e.tipo==='par'? e.p.h : e.tipo==='frase'? e.f[0] : e.tipo==='dialogo'? e.d.lineas[e.i][1] : (e.w || e.hz);
  if(!(e.banco && ok)) srsResponde(claveSRS(e), ok);   // un error del banco acertado antes de tiempo no alarga su repaso
  bancoResponde(e, ok);
  if(ok){
    L.hechos++; if(!L.errados.has(e)) L.xpGanado++;
    S.aciertos[clave]=(S.aciertos[clave]||0)+1;
    sellar('对');
    setAbajo('ok','Continuar',`<span class="mini">对</span><span class="txt">${frasesBien[Math.floor(Math.random()*frasesBien.length)]} <small>${extra}</small></span>`);
  }else{
    L.errados.add(e); L.cola.push(e);   // vuelve al final hasta que salga bien
    S.fallos[clave]=(S.fallos[clave]||0)+1;
    sellar('错');
    setAbajo('bad','Entendido',`<span class="mini">错</span><span class="txt">Era: <span class="${/[\u3400-\u9fff]/.test(sol)?'cjk':''}">${sol}</span><small>${extra}</small></span>`);
  }
  $('accion').disabled=false; guardar(); avance();
};

// lo que falló en la sesión, sin repetir
function listaFallos(){
  const vistos=new Set(), out=[];
  for(const e of L.errados){
    let f=null;
    if(e.w){ const p=P[e.w]; f={k:'p'+e.w,h:p.p,py:p.py,es:p.es}; }
    else if(e.hz){ const c=C[e.hz]; f={k:'h'+e.hz,h:c.h,py:c.py,es:c.es}; }
    else if(e.tipo==='par'){ const c=C[e.p.h]; f={k:'r'+e.p.h,h:c.h,py:'lleva '+e.p.a,es:e.p.por}; }
    else if(e.tipo==='frase'){ f={k:'f'+e.f[0],h:e.f[0],py:'',es:e.f[1]}; }
    else if(e.tipo==='dialogo'){ const x=e.d.lineas[e.i]; f={k:'d'+x[1],h:x[1],py:x[2],es:x[3]}; }
    if(f && !vistos.has(f.k)){ vistos.add(f.k); out.push(f); }
  }
  return out;
}
function cuenta(el,hasta,pre){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches || hasta<=0){ el.textContent=pre+hasta; return; }

  const paso=now=>{ const k=Math.min(1,(now-t0)/dur); el.textContent=pre+Math.round(hasta*(1-Math.pow(1-k,3))); if(k<1) requestAnimationFrame(paso); };
  requestAnimationFrame(paso);
}

      const hechas=hz.filter(c=>(S.planas[c]||0)>=3).length;
      return `<div class="grupo"><h4>${g.t} <small>· ${hechas}/${hz.length} · ${g.s}</small></h4><div class="rejilla">${hz.map(c=>
        `<button class="${(S.planas[c]||0)>=3?'hecha':''}" data-plana="${c}">${c}</button>`).join('')}</div></div>`; }).join('');
    document.querySelectorAll('[data-plana]').forEach(b=>b.onclick=()=>abrePlana(b.dataset.plana));
  }).catch(err=>{ $('planas-lista').innerHTML=`<p class="nota">No se pudieron cargar los trazos (${err.message}). Abre la app una vez con internet para que se guarden.</p>`; });
}
let W=null, modoPlana='ver', planaCh=null;
function contadorPlana(ch){ const n=S.planas[ch]||0; return n>=3 ? `完 · lo has escrito ${n} veces de memoria` : `De memoria: ${n}/3`; }
function abrePlana(ch){
  cierraFicha();
  cargaTrazos().then(()=>{
    if(!TRAZOS[ch]){ muestraError('No tengo los trazos de '+ch); return; }
    planaCh=ch; modoPlana='ver';
    $('camino').style.display='none'; $('leccion').style.display='none'; $('plana').style.display='block'; window.scrollTo(0,0);
    const [py,es]=infoHanzi(ch), d=TRAZOS[ch];
    $('plana-titulo').innerHTML=`<span class="cjk" style="font-size:22px">${ch}</span> ${py} · ${es}`;
    const paso=k=>`<svg viewBox="0 0 1024 1024"><g transform="translate(0,900) scale(1,-1)">${d.strokes.map((s,i)=>
      `<path d="${s}" fill="${i<k?(i===k-1?'#b5312b':'#1d1b18'):'#d9d4c7'}"/>`).join('')}</g></svg>`;
    $('plana-cuerpo').innerHTML=`<p class="nota" style="text-align:center;margin-top:4px">${d.strokes.length} trazos, en este orden:</p>
      <div class="pasos">${d.strokes.map((s,i)=>paso(i+1)).join('')}</div>
      <div class="modos"><button data-m="ver">1 · Ver</button><button data-m="calcar">2 · Calcar</button><button data-m="memoria">3 · De memoria</button></div>
      <div id="lienzo"></div><div id="plana-msg"></div>
      <p class="nota" style="text-align:center" id="plana-cuenta"></p>
      <div style="text-align:center">${oirBtn(ch)}</div>`;
    document.querySelectorAll('.modos button').forEach(b=>b.onclick=()=>{ modoPlana=b.dataset.m; arrancaPlana(); });
    arrancaPlana();
  }).catch(err=>muestraError('No se pudieron cargar los trazos: '+err.message));
}
function arrancaPlana(msg){
  const ch=planaCh;
  document.querySelectorAll('.modos button').forEach(b=>b.classList.toggle('on',b.dataset.m===modoPlana));
  $('plana-cuenta').textContent = contadorPlana(ch);
  $('plana-msg').textContent = msg || (modoPlana==='ver' ? '' : modoPlana==='calcar' ? 'Traza encima del gris, en orden.' : 'Ahora sin ayuda. Si fallas 3 veces un trazo, te lo muestro.');
  $('plana-msg').style.color = msg ? 'var(--jade)' : 'var(--ink2)';
  if(typeof HanziWriter==='undefined'){ $('lienzo').innerHTML='<p class="nota" style="padding:20px">Falta hanzi-writer.min.js</p>'; return; }
  if(W){ try{ W.cancelQuiz(); }catch(e){} } $('lienzo').innerHTML='';
  W=HanziWriter.create('lienzo', ch, {width:280,height:280,padding:16, charDataLoader:(c,listo)=>listo(TRAZOS[c]),
    showCharacter:false, showOutline:modoPlana!=='memoria', strokeColor:'#1d1b18', outlineColor:'#d9d4c7', highlightColor:'#b5312b',
    drawingColor:'#1d1b18', drawingWidth:26, strokeAnimationSpeed:1.1, delayBetweenStrokes:280, showHintAfterMisses:modoPlana==='memoria'?3:1});
  if(modoPlana==='ver'){ W.loopCharacterAnimation(); return; }
  W.quiz({ onComplete:r=>{
    if(modoPlana==='memoria'){ S.planas[ch]=(S.planas[ch]||0)+1;
      if(S.ultimoDia!==hoy()){ S.racha=(S.ultimoDia===ayer())?S.racha+1:1; S.ultimoDia=hoy(); } guardar(); }
    efecto('ok'); vibra(1);
    const m = r.totalMistakes ? `对 · con ${r.totalMistakes} error${r.totalMistakes>1?'es':''}. Otra vez:` : '对 ¡perfecto! Otra vez:';
    $('plana-msg').textContent=m; $('plana-msg').style.color='var(--jade)'; $('plana-cuenta').textContent=contadorPlana(ch);
    setTimeout(()=>{ if(planaCh===ch) arrancaPlana(m); },1300);
  }});
}
$('plana-salir').onclick=()=>{ if(W){ try{ W.cancelQuiz(); }catch(e){} } W=null; planaCh=null;
  $('plana').style.display='none'; $('camino').style.display='block'; pinta(); };

// ================== 树 ÁRBOL ==================
// Grafo radical → hanzi → palabras. Color: gris = sin ver, tinta = visto, rojo = dominado.
let filtroArbol='libro';
function estadoHanzi(ch){
  const k=Math.max(nivel('h:'+ch), nivel('p:'+ch), (S.planas[ch]||0)>=3?2:0);
  if(k>=3) return 2; if(k>=1) return 1;
  return palabrasLibro().some(w=>w.includes(ch) && S.srs['p:'+w]) ? 1 : 0;
}
const estadoPal=w=>{ const k=nivel('p:'+w); return k>=3?2:k>=1?1:0; };
function pintaArbol(){
  const libro=palabrasLibro(), multi=libro.filter(w=>[...w].length>1);
  const hz = filtroArbol==='libro' ? [...new Set(libro.join(''))] : [...new Set([...Object.keys(C), ...libro.join('')])];
  const porRad={};
  hz.forEach(ch=>{ const r=radDe(ch)||'?'; (porRad[r]=porRad[r]||[]).push(ch); });
  const rads=Object.keys(porRad).sort((a,b)=>porRad[b].length-porRad[a].length);
  const RH=40, X=[30,120,250]; let y=24; const nodos=[], aristas=[];
  rads.forEach(r=>{
    const y0=y, propias=[];
    porRad[r].forEach(ch=>{
      const pals=multi.filter(w=>w.includes(ch)), filas=Math.max(1,pals.length), yh=y+(filas-1)*RH/2;
      pals.forEach((w,i)=>{ const yw=y+i*RH; nodos.push({tipo:'p',id:w,x:X[2],y:yw}); aristas.push([X[1],yh,X[2],yw,estadoPal(w)]); });
      nodos.push({tipo:'h',id:ch,x:X[1],y:yh}); const a=[X[0],0,X[1],yh,estadoHanzi(ch)]; aristas.push(a); propias.push(a);
      y+=filas*RH;
    });
    const yr=(y0+y-RH)/2;
    propias.forEach(a=>a[1]=yr);
    nodos.push({tipo:'r',id:r,x:X[0],y:yr});
    y+=14;
  });
  const color=s=>[['#ece8de','#b9b2a3','#9a9384'],['#f3f1ea','#1d1b18','#1d1b18'],['#b5312b','#b5312b','#fff']][s];
  const nodo=n=>{
    if(n.tipo==='p'){ const [f,st,tx]=color(estadoPal(n.id)), wpx=[...n.id].length*20+20;
      return `<g class="nd" data-t="p" data-id="${n.id}"><rect x="${n.x-8}" y="${n.y-15}" width="${wpx}" height="30" rx="15" fill="${f}" stroke="${st}" stroke-width="1.5"/>
        <text x="${n.x+2}" y="${n.y+7}" font-size="19" font-family="Kai,KaiTi,serif" fill="${tx}">${n.id}</text></g>`; }
    const s = n.tipo==='h' ? estadoHanzi(n.id) : Math.max(...porRad[n.id].map(estadoHanzi)), [f,st,tx]=color(s), rr=n.tipo==='r'?19:16;
    return `<g class="nd" data-t="${n.tipo}" data-id="${n.id}"><circle cx="${n.x}" cy="${n.y}" r="${rr}" fill="${f}" stroke="${st}" stroke-width="${n.tipo==='r'?2.5:1.5}"/>
      <text x="${n.x}" y="${n.y+7}" text-anchor="middle" font-size="${n.tipo==='r'?22:20}" font-family="Kai,KaiTi,serif" fill="${tx}">${n.id}</text></g>`;
  };
  const arista=([x1,y1,x2,y2,s])=>`<path d="M${x1+18} ${y1} C ${(x1+x2)/2} ${y1}, ${(x1+x2)/2} ${y2}, ${x2-16} ${y2}" fill="none"
      stroke="${s===2?'#b5312b':s===1?'#4a463e':'#cfc9bb'}" stroke-width="${s?1.6:1.2}"/>`;
  const vistos=hz.filter(c=>estadoHanzi(c)>0).length;
  $('v-arbol').innerHTML=`<div class="filtro"><button data-f="libro" class="${filtroArbol==='libro'?'on':''}">Libro</button>
      <button data-f="todo" class="${filtroArbol==='todo'?'on':''}">Todo</button></div>
    <div class="leyenda"><span><i style="background:#ece8de;border-color:#b9b2a3"></i>sin ver</span><span><i style="background:#f3f1ea"></i>visto</span>
      <span><i style="background:#b5312b;border-color:#b5312b"></i>dominado</span><span>${vistos}/${hz.length} hanzi</span></div>
    <p class="nota">Radical → hanzi → palabras. Toca una bolita.</p>
    <svg id="arbol-svg" viewBox="0 0 360 ${y}">${aristas.map(arista).join('')}${nodos.map(nodo).join('')}</svg>`;
  document.querySelectorAll('.filtro button').forEach(b=>b.onclick=()=>{ filtroArbol=b.dataset.f; pintaArbol(); });
  document.querySelectorAll('#arbol-svg .nd').forEach(g=>g.onclick=()=>abreFicha(g.dataset.t,g.dataset.id));
}
function abreFicha(tipo,id){
  const f=$('ficha');
  let py='',es='',extra='';
  if(tipo==='r'){ es='Radical: '+(RADS[id]||''); }
  else if(tipo==='p'){ py=P[id].py; es=P[id].es; }
  else { [py,es]=infoHanzi(id);
    const w=palabrasLibro().filter(x=>x.includes(id) && x!==id);
    extra=[w.length?'Aparece en: '+w.join(', '):'', radDe(id)?`Radical ${radDe(id)}: ${RADS[radDe(id)]||''}`:''].filter(Boolean).join(' · '); }
  f.innerHTML=`<button class="cerrar" id="ficha-x">✕</button><div class="h">${id}</div><div class="p">${py}</div><div>${es}</div>
    ${extra?`<p class="nota">${extra}</p>`:''}
    <div class="acciones">${tipo!=='r'?'<button id="ficha-oir">'+ICO_OIR+' Escuchar</button>':''}${tipo!=='p'?'<button id="ficha-plana">写 Plana</button>':''}</div>`;
  f.style.display='block';
  $('ficha-x').onclick=cierraFicha;
  if($('ficha-oir')) $('ficha-oir').onclick=()=>habla(id);
  if($('ficha-plana')) $('ficha-plana').onclick=()=>abrePlana(id);
}
function cierraFicha(){ const f=document.getElementById('ficha'); if(f) f.style.display='none'; }

// ---------- extras ----------
$('exportar').onclick=()=>{
  const data={app:'hanzi-camino',version:3,exportado:new Date().toISOString(),xp:S.xp,racha:S.racha,ultimo_dia:S.ultimoDia,
    lecciones_hechas:S.hechas,aciertos:S.aciertos,fallos:S.fallos,repaso:S.srs,planas:S.planas,banco_errores:S.errores};
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
  a.download='hanzi-progreso-'+hoy()+'.json'; a.click();
};
$('borrar').onclick=()=>pregunta({sello:'删', titulo:'¿Borrar todo tu progreso?',
  texto:'Se borran lecciones, XP, racha, repasos y planas. No se puede deshacer. Si quieres, primero exporta tu progreso.',
  si:'Borrar todo', no:'Cancelar', peligro:true}).then(v=>{ if(v){ const son=S.sonido, vib=S.vibra; S=VACIO(); S.sonido=son; S.vibra=vib; guardar(); pinta(); pintaAjustes(); } });
pinta(); pintaAjustes();
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(e=>{});
</script>
